const statusEl=document.getElementById('status'), searchEl=document.getElementById('search'),
      rowsEl=document.getElementById('rows'), countEl=document.getElementById('count');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(){
  const st=statusEl.value, q=searchEl.value.trim().toLowerCase();
  const list=DATA.filter(d=>(st==='ALL'||d.status===st)&&(!q||d.doc_id.toLowerCase().includes(q)||d.cnr.toLowerCase().includes(q)));
  countEl.textContent=list.length+' of '+DATA.length+' documents';
  if(!list.length){rowsEl.innerHTML='<tr><td colspan="6" class="empty">No documents match.</td></tr>';return;}
  rowsEl.innerHTML=list.map((d,i)=>`<tr>
    <td>${i+1}</td>
    <td><code>${esc(d.doc_id)}</code></td>
    <td><code>${esc(d.cnr)}</code></td>
    <td>${d.pages}</td>
    <td><span class="badge ${d.status}">${d.status}</span></td>
    <td><button class="btn" onclick="window.open('${esc(d.pdf)}','_blank')">Open PDF</button></td>
  </tr>`).join('');
}
statusEl.addEventListener('change',render);
searchEl.addEventListener('input',render);
render();
