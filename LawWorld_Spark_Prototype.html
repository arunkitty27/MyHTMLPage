ORDER
The petitioner/accused No.1 is before this Court calling in question proceedings in C.C.No.16321 of 2020, arising out of a crime in Crime No.60 of 2020 pending before the V Additional Chief Metropolitan Magistrate Court, Bengaluru, for the offences under Sections 501, 504, 507 and 509 of IPC.

2. Facts, adumbrated, are as follows:-

A complaint comes to be registered on 19-03-2020 by the 2nd respondent/complainant, a married woman alleging that she was working as a Junior Health Assistant at a Primary Health Centre, Muttugaduru Village, Holalkere Taluk, Chitradurga District and while discharging her duty had given her mobile number to the officers at the Centre. She began getting unexpected calls at odd hours from various numbers who also threatened to her life. When she made enquires about the phone calls received, it is informed that her mobile number was displayed on the walls of gents toilet at Majestic bus stand, Bangalore calling her “a call girl”. The complaint further alleged that some staff known to her and being with her had done this and sought investigation to be conducted through a complaint. The crime comes to be registered by CEN Crime Police Station in Crime No.60 of 2020.

3. The Police conduct investigation and file a charge sheet against the petitioner and another for offences punishable under Sections 501, 504, 507 and 509 of the IPC. The filing of the charge sheet drives the petitioner to this Court in the subject petition. This Court in terms of its order dated 09.03.2022 grants an interim order of stay on the score that the offences registered at the time of registration of crime were the ones punishable under Sections 504 and 506 of the IPC, both of which were non-cognizable offences and for non-cognizable offences permission of the learned Magistrate to register the FIR was imperative and such permission was granted in the case at hand by the word "permitted". Therefore, all further proceedings were interdicted and the said interim order is in subsistence even to-day and no further trial has taken place against the petitioner.

4. Heard Sri Tejas N., learned counsel appearing for the petitioner, Sri B.N. Jagadeesh, learned Additional Special Public Prosecutor appearing for respondent No.1 and Sri R. Gopala Krishnan, learned counsel appearing for respondent No.2 / complainant.

5. The learned counsel appearing for the petitioner would vehemently contend that what was registered as a crime in Crime No.60 of 2020 was for offences punishable under Sections 504 and 506 of the IPC. They are admittedly non-cognizable offences. Therefore, the learned Magistrate ought to have applied his mind prior to grant of any permission to register the FIR. He would submit that the lis stands covered by plethora of judgments rendered by this Court with particular reference to the decision reported in VAGGEPPA GURULINGA JANGALIGI v. STATE OF KARNATAKA reported in ILR 2020 Kar 630. On the merit of the matter, the learned counsel would submit that there is no independent evidence against the petitioner. CW-5 at the time of investigation reveals the name of the petitioner. The allegation against the petitioner is that, he was asked to write on the walls of a toilet for men at the Majestic Bus stand, Bangalore, that the complainant was a 'call girl'. It is only that has led the petitioner into these proceedings. He would submit that voluntary statement of another cannot be taken as evidence to pin down the petitioner. He would seek quashment of the entire proceedings.

6. Per contra, the learned counsel representing the complainant submits that the complainant was not aware of what offences should be alleged when she registers the complaint. It was the duty of the Station House Officer or the Officer in-charge of the Police Station to have registered appropriate crime looking at the facts of the complaint as the complainant had produced all the necessary material to the Police Superintendent at Chitradurga District. It is the petitioner who has written on the walls at the Majestic Bus Stop, Bangalore taking the name of the complainant as a 'call girl' due to which, the complainant started getting innumerable calls from all quarters and, therefore, it was a clear case where it was an offence punishable under Section 509 of the IPC. Section 509 of the IPC being a cognizable offence whether the Magistrate has granted appropriate permission or not would not become relevant in the case at hand. He takes this Court through the application seeking vacation of the interim order and the documents appended thereto to demonstrate that about 20 pages of call records were taken prior to registration of crime. They were all put in a compact disc and given to the Station House Officer. All these led to the crime committed by the petitioner. He would submit that Section 509 of the IPC completely gets attracted in the case at hand and the interim order has caused grave prejudice to the victim. He would seek dismissal of the petition.

7. The learned Additional Special Public Prosecutor, Sri B.N.Jagadeesh, representing the State would also vehemently contend that while filing the charge sheet complete documents are collected, which clearly pin down the petitioner to be guilty of writing on the walls, as observed hereinabove. Therefore, it is his submission, that it is a matter of trial for the petitioner to come out clean.

ನಾನು ಈ ಮೇಲಿನ ವಿಳಾಸದಲ್ಲಿ ವಾಸವಿದ್ದುಕೊಂಡು, ಭರಮ್ಮಣ್ಣನಾಯಕನದುರ್ಗಾ ಗ್ರಾಮದಲ್ಲಿರುವ ಸಮುದಾಯ ಆರೋಗ್ಯ ಕೇಂದ್ರದಲ್ಲಿ ಕಿರಿಯ ಮಹಿಳಾ ಆರೋಗ್ಯ ಸಹಾಯಕಿಯಾಗಿ ಕೆಲಸ ಮಾಡಿಕೊಂಡಿರುತ್ತೇನೆ. ನಾನು ಈ ಹಿಂದೆ 9886614868 ಮೊಬೈಲ್ ನಂಬರ್ ಅನ್ನು ಉಪಯೋಗಿಸುತ್ತಿದ್ದೆನು. ಮುತ್ತುಗನೂರು ಗ್ರಾಮದಲ್ಲಿರುವ ಸಮುದಾಯ ಆರೋಗ್ಯ ಕೇಂದ್ರದಲ್ಲಿ ಹಿರಿಯ ಮಹಿಳಾ ಆರೋಗ್ಯ ಸಹಾಯಕಿಯಾಗಿ ಶ್ರೀಮತಿ. ಕಮಲಮ್ಮ ಎಂಬುವರು ಕೆಲಸ ಮಾಡುತ್ತಿದ್ದು, ಇವರು ಈ ಹಿಂದೆ ಮೊ.ನಂ.8277508992 ಅನ್ನು ಉಪಯೋಗಿಸುತ್ತಿದ್ದು, ನಾವಿಬ್ಬರು ಸ್ನೇಹಿತೆಯರಾಗಿರುತ್ತೇವೆ. ದಿನಾಂಕ:-31-01-2020 ರಿಂದ ಈ ನಮ್ಮ 2 ನಂಬರ್‌ಗಳಿಗೆ  ​9731370916,9986368521,9844675964,8970662347,9008122359, 7892615801,8880859574,9916346709,7892615809,9980338542,7604844072,7483130572,9141151398,9986368521,7338063797,
9482539858,8431128454,9148330149,6364676745,7975871724ಗಳಿಂದ ಹಲವಾರು ಬಾರಿ ಒಂದು ವಾರದ ಕಾಲ ಕರೆ ಬರುತ್ತಿದ್ದು, ನಾವು ಕರೆ ಸ್ವೀಕರಿಸಿದಾಗ ಅನಾಮಧೇಯ ವ್ಯಕ್ತಿಗಳು ನಮ್ಮ ಜೊತೆ ಅಶ್ಲೀಲವಾಗಿ ಮಾತನಾಡಿ ನೀನು ನಮ್ಮ ಜೊತೆ ಬಾ, ಬರದಿದ್ದರೆ ನಿಮ್ಮ ಪ್ರಾಣ ತೆಗೆಯುತ್ತೇನೆಂದು ಬೆದರಿಕೆ ಹಾಕುತ್ತಿದ್ದರು. ಆ ಸಮಯದಲ್ಲಿ ನಾವು ನೀವು ಯಾರು ಎಲ್ಲಿಂದ ಮಾತನಾಡುತ್ತಿದ್ದೀರಿ ಎಂದು ಕೇಳಿದಾಗ ಅವರುಗಳು ಬೆಂಗಳೂರಿನ ಮೆಜೆಸ್ಟಿಕ್ ಬಸ್‌ ನಿಲ್ದಾಣದ ಟರ್ಮಿನಲ್ 1 ರಲ್ಲಿರುವ ಶೌಚಲಯದ ಬಳಿಯಿಂದ ಎಂದು ತಿಳಿಸಿದ್ದರು ಆ ನಂತರದ ದಿನಗಳಲ್ಲಿ ನಾನು ಮತ್ತು ಕಮಲಮ್ಮ ಇಬ್ಬರು ಮೆಜೆಸ್ಟಿಕ್ ಗೆ ಬಂದು ಕೆ.ಎಸ್.ಆರ್.ಟಿ.ಸಿ. ಬಸ್‌ ನಿಲ್ದಾಣದ ಟರ್ಮಿನಲ್-1 ರಲ್ಲಿರುವ ಸಾರ್ವಜನಿಕ ಶೌಚಾಲಯದ ಬಳಿ ಬಂದು ನೋಡಲಾಗಿ ಪುರುಷರ ಶೌಚಾಲಯದ ಕಡೆ ಇರುವ ಬಾಗಿಲು ಮತ್ತು ಗೋಡೆಯ ಮೇಲೆ ನಮ್ಮ ಮೊಬೈಲ್ ನಂಬರ್‌ಗಳನ್ನು ಬರೆದು ಜೊತೆಗೆ ಕಾಲ್‌ಗರ್ಲ್ಸ್ ಎಂದು ಬರೆದಿದ್ದುದು ಕಂಡು ಬಂದಿತ್ತು. ಆ ಸಮಯದಲ್ಲಿ ನಾವು ನಮ್ಮ ಮೊಬೈಲ್ ನಂಬರ್‌ಗಳು ಕಾಣದಂತೆ ಸ್ಮಾಚ್ ಮಾಡಿಸಿದ್ದವು. ಆ ನಂತರ ಮೇಲ್ಕಂಡ ನಂಬರ್‌ಗಳಿಂದ ಮೇಲಿಂದ ಮೇಲೆ ಕರೆ ಬರುತ್ತಿದ್ದರಿಂದ ನಾವು ನಮ್ಮ ಮೊಬೈಲ್ ಸಿಮ್‌ಗಳನ್ನು ಬದಲಾಯಿಸಿದೆವು. ದಿನಾಂಕ:-19-03-2020 ರಂದು ಚಿತ್ರದುರ್ಗಾ ಜಿಲ್ಲೆಯ ಸಿ.ಇ.ಎನ್‌. ಅಪರಾಧ ಪೊಲೀಸ್‌ ಠಾಣೆಯಲ್ಲಿ ನಾನು ದೂರು ನೀಡಿದ್ದೆನು.
​
ಈ ಬಗ್ಗೆ ನನಗೆ ಹಾಗೂ ಶ್ರೀಮತಿ. ಕಮಲಮ್ಮ ಇಬ್ಬರಿಗೂ ನಮ್ಮ ಕಛೇರಿಯಲ್ಲಿ ಕೆಲಸ ಮಾಡುವ ಕಿರಿಯ ಸಹಾಯಕಿಯಾದ ಶ್ರೀಮತಿ ಶಿಲ್ಪಾ ಎಂಬಾಕೆಯ ಮೇಲೆ ಅನುಮಾನ ಬಂದು ಆಕೆಯನ್ನು ವಿಚಾರ ಮಾಡಲಾಗಿ ಆಕೆಯು ಕೆಲಸದ ಸ್ಥಳದಲ್ಲಿ ನಿಮ್ಮಿಂದ ನನಗೆ ಆಗುತ್ತಿದ್ದ ಕಿರಿಕಿರಿಯನ್ನು ತಪ್ಪಿಸಲು ನಾನು ಹಿರಿಯ ಅಧಿಕಾರಿಗಳಿಂದ ಫೋನ್ ಮಾಡಿಸು ಎಂದು ನನ್ನ ಸ್ನೇಹಿತನಾದ ಎ.ಬಿ. ಪಾಟೀಲ್ ಎಂಬುವರಿಗೆ ನಿಮ್ಮಗಳ ಮೊಬೈಲ್ ನಂಬರ್‌ಗಳನ್ನು ಕೊಟ್ಟಿದ್ದು, ಆತನೇನಾದರೂ ನಿಮ್ಮಗಳ ಮೊಬೈಲ್ ನಂಬರ್‌ಗಳನ್ನು ಶೌಚಾಲಯದ ಗೋಡೆಗಳ ಮೇಲೆ  ಬರೆದಿರುಬಹುದೆಂದು ಇದರಲ್ಲಿ ನನ್ನ ದುರುದ್ದೇಶವಿಲ್ಲ. ನಾನು ಆತನಿಗೆ ನಿಮ್ಮ ನಂಬರ್‌ಗಳನ್ನು ಕೊಟ್ಟಿದ್ದು ತಪ್ಪಾಯಿತೆಂದು ಹೇಳಿ ನಮ್ಮಗಳ ಬಳಿ ಕ್ಷಮೆ ಕೇಳಿರುತ್ತಾಳೆ.

ಕೃತ್ಯ ನಡೆದ ಸ್ಥಳದ ಆಧಾರದ ಮೇಲೆ ಸಿ.ಇ.ಎನ್. ಅಪರಾಧ ಪೊಲೀಸ್ ಠಾಣೆಯವರು ಉಪ್ಪಾರಪೇಟೆ ಪೊಲೀಸ್ ಠಾಣೆಗೆ ನಮ್ಮ ದೂರಿನ ಕಡತವನ್ನು ವರ್ಗಾವಣೆ ನೀಡಿರುವ ವಿಚಾರವಾಗಿ ತನಿಖೆಗೆ ಹಾಜರಾಗುವಂತೆ ಉಪ್ಪಾರಪೇಟೆ ಪೊಲೀಸರ ದೂರವಾಣಿ, ಕರೆಯ ಮೇರೆಗೆ ಈ ದಿನ ನಾನು ಮತ್ತು ಕಮಲಮ್ಮ ಇಬ್ಬರು ಉಪ್ಪಾರಪೇಟೆ ಠಾಣೆಗೆ ಹಾಜರಾಗಿದ್ದು, ಆ ನಂತರ ಕೃತ್ಯ ನಡೆದ ಸ್ಥಳವಾದ ಕೆ.ಎಸ್.ಆರ್.ಟಿ.ಸಿ. ಟರ್ಮಿನಲ್-1 ರ ಸಾರ್ವಜನಿಕ ಶೌಚಾಲಯದ ಸ್ಥಳವನ್ನು ಪೊಲೀಸರಿಗೆ ತೋರಿಸಿದ್ದು, ಪೊಲೀಸರು ಪಂಚರ ಸಮಕ್ಷಮ ಸ್ಥಳ ಪಂಚನಾಮೆಯನ್ನು ನಡೆಸಿರುತ್ತಾರೆ. ಸದರಿ ಶೌಚಾಲಯದ ಗೋಡೆ ಮತ್ತು ಬಾಗಿಲ ಮೇಲೆ ಬರೆದಿದ್ದ ನಮ್ಮ ಮೊಬೈಲ್ ನಂಬರ್ ಳ ಮೇಲೆ ಬಣ್ಣ ಹೊಡೆದಿರುವುದು ಈ ಸಮಯದಲ್ಲಿ ಕಂಡು ಬಂದಿರುತ್ತೆ.

ಆದ್ದರಿಂದ ಸದರಿ ಶಿಲ್ಪಾಳನ್ನು ಹೊರತುಪಡಿಸಿ, ನಮ್ಮ ನಂಬರ್‌ಗಳನ್ನು ಶೌಚಾಲಯದ ಗೋಡೆಗಳ ಮೇಲೆ ಬರೆದವರನ್ನು ಹಾಗೂ ಸದರಿ ನಮ್ಮಗಳ ಮೊಬೈಲ್ ನಂಬರ್‌ಗಳಿಗೆ ಸಾರ್ವಜನಿಕರು ಕರೆ ಮಾಡಿ ಅಶ್ಲೀಲವಾಗಿ ಮಾತನಾಡಿ ಪ್ರಾಣ ಬೆದರಿಕೆ ಹಾಕುತ್ತಿದ್ದ ಆರೋಪಿತರನ್ನು ಪತ್ತೆ ಮಾಡಿ ಕಾನೂನು ಕ್ರಮ ಜರುಗಿಸಲು ಕೋರುತ್ತೇನೆ."

The complainant narrates in detail that she had given her mobile number to Shilpa, and Shilpa had revealed that she had given the number of the complainant to one Alla Baksh Patel @ A.B. Patel, the petitioner, to do the job of writing on the walls of gents’ toilet at Majestic bus stand, Bangalore. The statement of Shilpa is recorded on 13-08-2020 as by then, Shilpa confessed and had also sought pardon for the act she has done. The statement of Shilpa reads as follows:

"ಶ್ರೀಮತಿ ಶಿಲ್ಪಾ ಕೋಚಆನಂದ ಮೂರ್ತಿ ರವರ ಪುತ್ರ , 30 ವರ್ಷ, ವಾಸ: ಬರಮ್ಮನ ನಾಯಕನ ದುರ್ಗ ಗ್ರಾಮ, ಈಶ್ವರ ದೇವಸ್ಥಾನದ ಹತ್ತಿರ, ಬರಮ್ಮಣ್ಣನ ನಾಯಕನ ದುರ್ಗ ಹೋಬಳಿ, ಹೊಳಲ್ಕೆರೆ ತಾಲೂಕು, ಚಿತ್ರದುರ್ಗ ಜಿಲ್ಲೆ: ಮೊ.9148063045. 

ದಿನಾಂಕ:-13-08-2020.

ನಾನು ಈ ಮೇಲಿನ ವಿಳಾಸದ ಹಾಲೇಶಪ್ಪ ಎಂಬುವರ ಮನೆಯಲ್ಲಿ ಈಗ್ಗೆ ಸುಮಾರು 2 ವರ್ಷದಿಂದ ನಮ್ಮ ಯಜಮಾನರು ಹಾಗೂ ಮಕ್ಕಳಾದ 10 ವರ್ಷದ ಅರ್ಚನಾ, 7 ವರ್ಷದ ನಮಿತಾ ರವರೊಂದಿಗೆ ಬಾಡಿಗೆಗೆ ವಾಸವಿದ್ದುಕೊಂಡು, ಮುತ್ತುಗದೂರಿನ ಪ್ರಾಥಮಿಕ ಆರೋಗ್ಯ ಕೇಂದ್ರದಲ್ಲಿ ಕಿರಿಯ ಮಹಿಳಾ ಆರೋಗ್ಯ ಸಹಾಯಕಿಯಾಗಿ 2018ನೇ ಸಾಲಿನ ನವೆಂಬರ್ ಮಾಹೆಯಿಂದ ಕೆಲಸ ಮಾಡಿಕೊಂಡಿರುತ್ತೇನೆ. ನಮ್ಮ ಯಜಮಾನರು ನಮ್‌ಮ ಊರಿನಲ್ಲಿಯೇ ಬ್ಯಾಂಗಲ್ ಸ್ಟೋರ್ ಇಟ್ಟುಕೊಂಡು ವ್ಯವಹರಿಸಿಕೊಂಡಿರುತ್ತಾರೆ. ನನ್ನ ಇಬ್ಬರು ಮ್ಮಕಳು ಚಿಕ್ಕಜಾಜೂರಿನ ಅಕ್ಷರ ವಿದ್ಯಾನಿಕೇತನ ಎಂಬ ಶಾಲೆಯಲ್ಲಿ ವ್ಯಾಸಂಗ ಮಾಡಿಕೊಂಡಿರುತ್ತಾರೆ. ನಾನು ಪಿ.ಯು.ಸಿ. ವಿದ್ಯಾಭ್ಯಾಸ ಮಾಡಿರುತ್ತೇನೆ.

ನಾನು ಕೆಲಸ ಮಾಡುವ ಮುತ್ತಗದೂರಿನ ಪ್ರಾಥಮಿಕ ಆರೋಗ್ಯ ಕೇಂದ್ರದಲ್ಲಿ ಹೊಳಲ್ಕೆರೆಯ ವಾಸಿ ಕಮಲಮ್ಮ ಎಂಬುವರು ಹಿರಿಯ ಮಹಿಳಾ ಆರೋಗ್ಯ ಸಹಾಯಕಿಯಾಗಿ ಹಾಗೂ ನಮ್ಮ ಊರಿನ ವಾಸಿಯಾದ ಶ್ರೀಮತಿ. ಹಸೀನಾ ಬೀ ಎಂಬುವರು ಕಿರಿಯ ಮಹಿಳಾ ಆರೋಗ್ಯ ಸಹಾಯಕಿಯಾಗಿ ಕೆಲಸ ಮಾಡಿಕೊಂಡಿದ್ದರು. ನಾನು 2018ನೇ ಸಾಲಿನ ನವೆಂಬ‌ರ್ ಮಾಹೆಯಲ್ಲಿ ಕೆಲಸಕ್ಕೆ ಸೇರಿಕೊಂಡು 2-3 ತಿಂಗಳ ಬಳಿಕ ಕಮಲಮ್ಮ ರವರು ನನ್ನ ಮೇಲೆ ಕೆಲಸದ ವಿಚಾರವಾಗಿ ದೌರ್ಜನ್ಯವೆಸಗಲು ಹಾಗೂ ಸಣ್ಣಪುಟ್ಟ ವಿಚಾರಗಳಿಗೂ ತೊಂದರೆ ಕೊಡಲು ಶುರು ಮಾಡಿದರು. ಕಮಲಮ್ಮ ಮತ್ತು ಹಸೀನಾ ಬೀ ಇಬ್ಬರು ತುಂಬಾ ಅನ್ನೋನ್ಯವಾಗಿದ್ದರಿಂದ ಹಸೀನಾ ಬೀ ಸಹ ಕಮಲಮ್ಮನ ಜೊತೆ ಸೇರಿ ನನಗೆ ತೊಂದರೆ ಕೊಡಲು ಪ್ರಾರಂಭಿಸಿ ಇಬ್ಬರು ಹಿರಿಯ ಅಧಿಕಾರಿಗಳ ಬಳಿ ನನ್ನ ಮೇಲೆ ಇಲ್ಲಸಲ್ಲದ ಆರೋಪಗಳನ್ನು ಮಾಡತ್ತಿದ್ದರು. ಈ ಸಂಬಂಧ ಹಿರಿಯ ಅಧಿಕಾರಿಗಳು ನನಗೆ ಎಚ್ಚರಿಕೆ ಕೊಡುತ್ತಿದ್ದರು.

ನಾನು ಎಷ್ಟೇ ಸೌಜನ್ಯದಿಂದ ನನ್ನ ಕೆಲಸವನ್ನು ನಾನು ಮಾಡಿಕೊಂಡು ಹೋಗುತ್ತಿದ್ದರು ಸಹ ಇವರಿಬ್ಬರು ನನಗೆ ತೊಂದರೆ ಕೊಡುವುದನ್ನು ಬಿಡಲಿಲ್ಲ. ಈ ವಿಚಾರವನ್ನು ನಾನು ನನ್ನ ಸ್ನೇಹಿತನಾದ ಚಿತ್ರದುರ್ಗಾದ ಐ.ಯು.ಡಿ.ಪಿ. ಲೇಔಟ್‌ನ ವಾಸಿ ಎ.ಬಿ. ಪಾಟೇಲ್ ಎಂಬುವರನ್ನು 2020ನೇ ಜನವರಿ ಮಾಹೆಯಲ್ಲಿ ಭೇಟಿ ಮಾಡಿ ನನ್ನ ಕೆಲಸದ ಸ್ಥಳದಲ್ಲಿ ಇವರಿಬ್ಬರಿಂದ ಆಗುತ್ತಿರುವ ತೊಂದರೆಯನ್ನು ತಪ್ಪಿಸುವಂತೆ ಹೇಳಿಕೊಂಡೆನು. ಆಗ ಆತನು ಅವರಿಬ್ಬರ ಮೊಬೈಲ್ ನಂಬ‌ರ್ ಅನ್ನು ಕೊಡು ದೊಡ್ಡವರಿಂದ ಅವರಿಗೆ ಪೋನ್ ಮಾಡಿಸಿ ನಿನ್ನ ತಂಟೆಗೆ ಬಾರದಂತೆ ಎಚ್ಚರಿಕೆ ಕೊಡಿಸುತ್ತೇನೆಂದು ಹೇಳಿದನು. ಆಗ ನಾನು ಹಸೀನಾ ಬೀ ರವರ ಮೊಬೈಲ್ ನಂ.9886614868 ಅನ್ನು ಹಾಗೂ ಕಮಲಮ್ಮ ರವರ ಮೊಬೈಲ್ ನಂ.8277508992 ಅನ್ನು ಆತನಿಗೆ ಕೊಟ್ಟಿದ್ದೆನು.

ಇದಾದ ಬಳಿಕ ಕಮಲಮ್ಮ ಮತ್ತು ಹಸೀನಾ ಬೀ ರವರ ಮೇಲ್ಕಂಡ ಮೊಬೈಲ್‌ ನಂಬ‌ರ್ ಗಳಿಗೆ ಮೆಜೆಸ್ಟಿಕ್ ಬಸ್ ನಿಲ್ದಾಣದ ಶೌಚಾಲಯದ ಬಳಿಯಿಂದ ಸುಮಾರು ಜನ ಸಾರ್ವಜನಿಕರು ಕಾಲ್ ಮಾಡಿ ತಮ್ಮ ಜೊತೆಯಲ್ಲಿ ಬರುವಂತೆ, ಬರೆದಿದ್ದರೆ ಪ್ರಾಣ ತೆಗೆಯುವುದಾಗಿ ಬೆದರಿಕೆ ಹಾಕಿ ಅಶ್ಲೀಲವಾಗಿ ಮಾತನಾಡುತ್ತಿದ್ದ ವಿಚಾರವು ನಾನು ಕೆಲಸ ಮಾಡುವ ಸ್ಥಳದಲ್ಲಿ ಕಮಲಮ್ಮ ಮತ್ತು ಹಸೀನಾ ಬೀ ರವರು ಮಾತನಾಡಿಕೊಳ್ಳುವಾಗ ನನಗೆ ತಿಳಿದು ಬಂತು. ಬಳಿಕ ಹಸೀನಾ ಬೀ ರವರು ಈ ವಿಚಾರವಾಗಿ ಚಿತ್ರದುರ್ಗಾದ ಸಿ.ಇ.ಎನ್. ಅಪರಾಧ ಪೊಲೀಸ್ ಠಾಣೆಯಲ್ಲಿ ದೂರು ನೀಡಿದ ವಿಚಾರ ಗೊತ್ತಾಗಿ ಕೂಡಲೇ ಎ.ಬಿ. ಪಾಟೀಲ್ ನನ್ನು ಭೇಟಿ ಮಾಡಿ ಬೆಂಗಳೂರು ನಗರದ, ಮೆಜಿಸ್ಟಿಕ್ ಬಸ್‌ ನಿಲ್ದಾಣದ ಶೌಚಾಲಯದ ಗೋಡೆಗಳ ಮೇಲೆ ಹಸೀನಾ ಬೀ ಮತ್ತು ಕಮಲಮ್ಮ ರವರ ಮೊಬೈಲ್ ನಂಬರಗಳನ್ನು ಕಾಲ್ ಗರ್ಲ್ ಎಂದು ಬರೆದಿದ್ದರಿಂದ ಸುಮಾರು ಜನ ಸಾರ್ವಜನಿಕರು ಹಸೀನಾ ಬೀ ಮತ್ತು ಕಮಲಮ್ಮ ರವರಿಗೆ ಕಾಲ್ ಮಾಡಿ ಮಾತನಾಡುತ್ತಿದ್ದಾರಂತೆ ನಾನು ನಿನಗೆ ಅವರುಗಳ ಮೊಬೈಲ್ ಫೋನ್ ನಂಬ‌ರ್ ಕೊಟ್ಟಿದ್ದೆನಲ್ಲ ನೀನೇನಾದೂ ರೀತಿ ಮಾಡಿರುವೆಯಾ ಎಂದು ವಿಚಾರ ಮಾಡಲಾಗಿ ಆತನು ನನಗೇನು ಅದರ ಬಗ್ಗೆ ಗೊತ್ತಿಲ್ಲವೆಂದು, ತಿಳಿಸಿದನು. ಆದರೆ ಎ.ಬಿ, ಪಾಟೀಲನೇ ನಾನು ಕೊಟ್ಟಿದ್ದ ಹಸೀನಾ ವೀ ಮತ್ತು ಕಮಲಮಗೆ ರವರ ಮೊಬೈಲ್ ನಂಬರ್‌ಗಳನ್ನು ಕಾಲ್ ಗರ್ಲ್ ಎಂದು ಬೆಂಗಳೂರಿನ ಮೆಜೆಸ್ಟಿಕ್, ಬಸ್‌ ನಿಲ್ದಾಣದ ಶೌಚಾಲಯದ ಗೋಡೆಗಳ ಮೇಲೆ ಬರೆದಿರುವುದು ಬೇರೆಯವರಿಂದ ನನಗೆ ಗೊತ್ತಾಯಿತು.

ಇದಾದ ಬಳಿಕ ಹಸೀನಾ ಬೀ ಮತ್ತು ಕಮಲಮ್ಮ ರವರು ನನ್ನ ಮೇಲೆ ಅನುಮಾನ ಬಂದು ಈ ವಿಚಾರವಾಗಿ ನನ್ನನ್ನು ವಿಚಾರ ಮಾಡಲು ಶುರು ಮಾಡಿದರು. ಆದರೆ ನನ್ನ ಸ್ನೇಹಿತನಾದ ಎ.ಬಿ. ಪಾಟೀಲನು ಕಮಲಮ್ಮ ಮತ್ತು ಹಸೀನಾ ಬೀ ರವರಿಗೆ ದೊಡ್ಡವರಿಂದ ಪೋನ್ ಮಾಡಿಸಿ ಅವರು ನಿನ್ನ ತಂಟೆಗೆ ಬಾರದಂತೆ ಎಚ್ಚರಿಕೆ ಕೊಡಿಸುತ್ತೇನೆಂದು ಹೇಳಿ ನನ್ನಿಂದ ಅವರುಗಳ ನಂಬರ್‌ಗಳನ್ನು ಪಡೆದುಕೊಂಡವನು ಆ ರೀತಿ ಮಾಡದೆ, ಅಡ್ಡದಾರಿ ಹಿಡಿದು ಬೆಂಗಳೂರಿನ ಮೆಜೆಸ್ಟಿಕ್ ಶೌಚಾಲಯ ಗೋಡೆಗಳ ಮೇಲೆ ಕಾಲ್‌ಗರ್ಲ್ ಎಂದು ಸದರಿ ಮೊಬೈಲ್ ನಂಬರ್‌ಗಳನ್ನು ಬರೆದು ಸಾರ್ವಜನಿಕರು ಆ ನಂಬರ್ ಗಳಿಗೆ ಕಾಲ್ ಮಾಡಿ ಅಶ್ಲೀಲವಾಗಿ ಮಾತನಾಡಿ ಪ್ರಾಣ ಬೆದರಿಕೆ ಹಾಕಲು ಕಾರಣಕರ್ತನಾಗಿರುತ್ತಾನೆ. ಇದರಲ್ಲಿ ನನ್ನ ದುರುದ್ದೇಶವೇನು ಇರುವುದಿಲ್ಲ. ನಾನು ಎ.ಬಿ. ಪಾಟೀಲನಿಗೆ ಈ ರೀತಿ ಮಾಡು ಎಂದು ಹೇಳಿರಲಿಲ್ಲ. ನಾನು ಯಾವತ್ತು ಕಮಲಮ್ಮ ಮತ್ತು ಹಸೀನಾ ಬೀ ರವರಿಗೆ ತೊಂದರೆ ಕೊಟ್ಟಿರುವುದಿಲ್ಲ. ಇನ್ನು ಮುಂದೆಯೂ ಸಹ ಯಾವುದೇ ರೀತಿಯಲ್ಲೂ ತೊಂದರೆ ಕೊಡುವುದಿಲ್ಲ. ನಾನು ಸದರಿಯವರಿಬ್ಬರ ನಂಬರ್ ಗಳನ್ನು ಎ.ಬಿ. ಪಾಟೀಲ್ ಗೆ ಕೊಟ್ಟಿದ್ದ ಬಗ್ಗೆ ನಾನು ಈಗಾಗಲೇ ಸದರಿಯವರಲ್ಲಿ ಕ್ಷಮೆ ಕೇಳಿರುತ್ತೇನೆ.

ಓದಿ ನೋಡಲಾಗಿ ಸರಿಯಿದೆ.

The statement of Shilpa is that, she and the petitioner are close friends and she had instructed the petitioner to write on the wall of the toilet of men, in the Majestic bus stand, depicting the complainant to be a call girl along with her number. The reason for such writing was resentment against the complainant due to a squabble between Shilpa and the complainant, at the Primary Health Centre in Chitradurga. The statement clearly narrates as to how the petitioner was directed and how the direction was complied with by the petitioner. After effect of the statement and the direction is, filing of the charge sheet by the jurisdictional Police. Column No.7 of the charge sheet which depicts the summary, reads as follows:

"ಈ ದೋಷಾರೋಪಣ ಪಟ್ಟಿಯ ಕಾಲಂ ನಂ.6 ರಲ್ಲಿ ನಮೂದಿಸಿರುವ ಸಾಕ್ಷಿ-1 ಮತ್ತು ಸಾಕ್ಷಿ -5 ರವರು ಚಿತ್ರದುರ್ಗ ಜಿಲ್ಲೆಯ ಮುತ್ತಗದೂರಿನ ಪ್ರಾಥಮಿಕ ಆರೋಗ್ಯ ಕೇಂದ್ರದಲ್ಲಿ ಕಿರಿಯ ಮಹಿಳಾ ಆರೋಗ್ಯ ಸಹಾಯಕಿಯರಾಗಿ, ಸಾಕ್ಷಿ-2 ರವರು ಹಿರಿಯ ಮಹಿಳಾ ಆರೋಗ್ಯ ಸಹಾಯಕಿಯಾಗಿ ಕೆಲಸ ಮಾಡಿ ಕೊಂಡಿದ್ದು, ಸಾಕ್ಷಿ-1 ಮತ್ತು ಸಾಕ್ಷಿ-2 ರವರು 2019 ನೇ ಜನವರಿ ಮಾಹೆಯಿಂದೀಚೆಗೆ ಆಫೀಸ್ ಕೆಲಸದ. ವಿಚಾರವಾಗಿ ಸಾಕ್ಷಿ-5 ರವರಿಗೆ ಇಲ್ಲ ಸಲ್ಲದ ತೊಂದರೆ ಕೊಡುತ್ತಿದ್ದು, ಸಾಕ್ಷಿ-5 ರವರು ಈ ವಿಚಾರವನ್ನು 2020 ನೇ ಜನವರಿಯಲ್ಲಿ ತನ್ನ ಸ್ನೇಹಿತನಾದ ಕಾಲಂ ನಂ 4 ರಲ್ಲಿ ಕಂಡ ಎ-1 ಆರೋಪಿಯ ಜೊತೆ ಹಂಚಿಕೊಂಡಿದ್ದು, ಆಗ ಎ-1 ಆರೋಪಿಯು ಅವರಿಬ್ಬರ ಮೊಬೈಲ್ ನಂಬರ್ ಕೊಡು ದೊಡ್ಡವರಿಂದ ಅವರಿಗೆ ಪೋನ್ ಮಾಡಿಸಿ ನಿನ್ನ ತಂಟೆಗೆ ಬಾರದಂತೆ ಎಚ್ಚರಿಕೆ ಕೊಡಿಸುತ್ತೇನೆಂದು ಹೇಳಿ ಸಾಕ್ಷಿ-1 ಮತ್ತು ಸಾಕ್ಷಿ-2 ರವರ ಮೊಬೈಲ್ ನಂಬರ್ ಗಳಾದ 9886614868, 8277508992 ಅನ್ನುಸಾಕ್ಷಿ-5 ರವರಿಂದ ಪಡೆದುಕೊಂಡವನು, ಯಾರಿಂದಲೂ ಅವರಿಗೆ ಪೋನ್ ಮಾಡಿಸದೆ, ಅನ್ಯ ಮಾರ್ಗವನ್ನು ಹಿಡಿದು, ಮಹಿಳೆಯ ಮಾನಹಾನಿಕರವೆಂದು ತಿಳಿದೂ ಸಹ ಎ-1 ಆರೋಪಿಯು ಬೆಂಗಳೂರಿನ ಉಪ್ಪಾರಪೇಟೆ ಪೊಲೀಸ್‌ ಠಾಣಾ ಸರಹದ್ದಿನ ಮೆಜೆಸ್ಟಿಕ್ ಕೆ,ಎಸ್,ಆರ್.ಟಿ.ಸಿ ಬಸ್ ನಿಲ್ದಾಣದ ಟರ್ಮಿನಲ್ 1 ರ ಸಾರ್ವಜನಿಕ ಶೌಚಾಲಯದ ಗೋಡೆ ಮತ್ತು ಬಾಗಿಲ ಮೇಲೆ ಸಾಕ್ಷಿ-1 ಮತ್ತು ಸಾಕ್ಷಿ-2 ರವರ ಮೇಲ್ಕಂಡ ಮೊಬೈಲ್ ನಂಬರ್‌ಗಳನ್ನು ಹಾಗೂ ಕಾಲ್ ಗರ್ಲ್ ಎಂದು ಇದೇ ವರ್ಷ ಜನವರಿ ತಿಂಗಳಲ್ಲಿ ಬರೆದು ಸಾಕ್ಷಿ-1 ಮತ್ತು ಸಾಕ್ಷಿ-2 ರವರ ಮಾನಕ್ಕೆ ದಕ್ಕೆಯನ್ನು ತಂದಿದ್ದು, ಅಂದಿನಿಂದ ಸದರಿ ಶೌಚಾಲಯಕ್ಕೆ ಬರುವ ಸುಮಾರು ಜನ ಪುರುಷ ಸಾರ್ವಜನಿಕರು ಬೇರೆ ಬೇರೆ ನಂಬ‌ರ್ ಗಳಿಂದ ಸಾಕ್ಷಿ-1 ಮತ್ತು ಸಾಕ್ಷಿ-2 ರವರ ಮೊಬೈಲ್ ನಂಬರ್‌ಗಳಿಗೆ ಕಾಲ್ ಮಾಡಿ ತಮ್ಮ ಹೆಸರು ಹೇಳಿ ಕೊಳ್ಳದೆ, ನಮ್ಮ ಜೊತೆಯಲ್ಲಿ ಬರುತ್ತೀಯಾ ಎಂದು ಕೇಳಿ ಅಶ್ಲೀಲವಾಗಿ ಮಾತನಾಡಿ ಬೆದರಿಕೆ ಹಾಕುತ್ತಿದ್ದು, ಇದೇ ರೀತಿ ಎ-2 ಆರೋಪಿಯು ದಿನಾಂಕ:-20-02-2020 ರಂದು ಬೆಳಿಗ್ಗೆ ಸದರಿ ಶೌಚಾಲಯಕ್ಕೆ ಬಂದಾಗ ಈ ಮೊಬೈಲ್ ನಂಬರ್‌ಗಳನ್ನು ಪೀಡ್ ಮಾಡಿಕೊಂಡು ಅದೇ ದಿನ ಬೆಳಿಗ್ಗೆ ಸುಮಾರು 08-20 ಗಂಟೆಯಲ್ಲಿ ತನ್ನ ಮೊಬೈಲ್ ನಂಬರ್ 9731370916 ರಿಂದ ಸಾಕ್ಷಿ-1 ರವರ ಮೊಬೈಲ್ ನಂಬರ್ 9886614868 ಗೆ ಕಾಲ್ ಮಾಡಿ ನನ್ನ ಜೊತೆ ಬರುತ್ತೀಯಾ ಎಂದು ಕೇಳಿ, ಅಶ್ಲೀಲವಾಗಿ ಮಾತನಾಡಿ ಬರಲಿಲ್ಲವೆಂದರೆ ನಿನ್ನನ್ನು ಮುಗಿಸಿಬಿಡುತ್ತೇನೆಂದು. ಪ್ರಾಣ ಬೆದರಿಕೆ ಹಾಕಿ ಮಹಿಳೆಯ ಮಾನಕ್ಕೆ ಕುಂದುಂಟುಮಾಡಿ ಈ ಮೇಲ್ಕಂಡ ಕಲಂಗಳಯ ಅನ್ವಯ ಶಿಕ್ಷಾರ್ಹ ಅಪರಾಧವೆಸಗಿರುತ್ತಾರೆ.


ಆದ್ದರಿಂದ ಆರೋಪಿಗಳ ವಿರುದ್‌ಧ ಈ ದೋಷಾರೋಪಣ ಪಟ್ಟಿ ಸಲ್ಲಿಸಿರುತ್ತೆ.”

A perusal at the summary of the charge sheet supra would clearly indicate, albeit, prima facie, that the offence so alleged would be met. The charge sheet is filed for offences punishable under Sections 501, 504, 507 and 509 of the IPC. I therefore, deem it appropriate to notice the said provisions. They read as follows:

"501. Printing or engraving matter known to be defamatory. - Whoever prints or engraves any matter, knowing or having good reason to believe that such matter is defamatory of any person, shall be punished with simple imprisonment for a term which may extend to two years, or with fine, or with both.

...           ...          ...

504. Intentional insult with intent to provoke breach of the peace. -Whoever intentionally insults, and thereby gives provocation to any person, intending or knowing it to be likely that such provocation will cause him to break the public peace, or to commit any other offence, shall be punished with imprisonment of either description for a term which may extend to two years, or with fine, or with both.

...                     ...                 ...

507. Criminal intimidation by an anonymous communication.—Whoever commits the offence of criminal intimidation by an anonymous communication, or having taken precaution to conceal the name or abode of the person from whom the threat comes, shall be punished with imprisonment of either description for a term which may extend to two years, in addition to the punishment provided for the offence by the last preceding section.
...                     ...                 ...

“509. Word, gesture or act intended to insult the modesty of a woman.—Whoever, intending to insult the modesty of any woman, utters any word, makes any sound or gesture, or exhibits any object, intending that such word or sound shall be heard, or that such gesture or object shall be seen, by such woman, or intrudes upon the privacy of such woman, shall be punished with simple imprisonment for a term which may extend to three years, and also with fine.”
(Emphasis supplied)

Section 501 of the IPC deals with printing or engraving matter known to be defamatory. Section 504 of the IPC deals with intentional insult with intent to provoke breach of peace. Section 507 of the IPC deals with criminal intimidation by an anonymous communication. Section 509 of the IPC deals with word, gesture or act intended to insult the modesty of a woman. The allegation is engraving on the wall of men's toilet at the Majestic bus stand that the complainant is a call girl and also gives the mobile number of the complainant. It would clearly attract the ingredients of Section 509 of the IPC as Section 509 of the IPC makes it an offence against the accused whoever intends to insult the modesty of any woman, utters any word or makes any sound or gesture or intrusion to the privacy of such woman would be punished with a term which would extend upto three years.

11. The facts obtaining the case at hand would clearly fit into the ingredients of the allegations of the offences so alleged, more so, in the light of the fact of documents produced by the learned counsel representing respondent No.2 / complainant that innumerable calls coming to the complainant as she had been depicted to be a call girl with all sorts of questions being asked, which would be clearly intrusion of privacy of the complainant and insult to the modesty of a woman.

12. The case projected by the learned counsel for the petitioner is twofold – one being that the permission of the learned Magistrate is by the word “permitted” which would run foul of the judgment of the coordinate Bench in the case of Vaggeppa Gurulinga Jangaligi supra. No doubt, the coordinate Bench has held that if permission granted by the Magistrate is by the word “permitted”, it would vitiate entire proceedings. The said judgment is distinguishable to the facts obtaining in the case at hand without much ado. The narration in the complaint was very clear that it would touch upon the modesty of a woman. If the Officer at the Police Station or one who registers the complaint does not look into the contents of the complaint and registers appropriate offence, the victim cannot be put to jeopardy. If acts of the Police in not registering appropriate offence based upon the facts in the complaint, it is the folly of the Police and the victim cannot be asked to suffer. Justice to the victim is the soul of the procedure depicted under the Code of Criminal Procedure, 1973. Same goes with the order of the learned Magistrate. The learned Magistrate permits registration of the crime by the sole word "permitted". In plethora of cases, this Court has cautioned those Magistrates not to play with the life of the victims by non-application of mind. This is another classic illustration where the victim has suffered as the order of the learned Magistrate does not have semblance of application of mind. However, that would not mean that the accused would get away with the crime, as the crime is registered by the Police after conduct of investigation and the investigation has led to filing of charge sheet and drawing up of the names of the accused. The petitioner was not an accused at the time of registration of crime. He springs in, only in the charge sheet. It would not lie in the mouth of the petitioner to contend that the learned Magistrate has not applied his mind while granting permission. In any event that would not vitiate entire proceedings, in the peculiar facts of this case.

13. The allegation, as observed hereinabove, is intending to insult the modesty of a woman. Modesty of a woman cannot be treated so casually, as is done in the case at hand. The Apex Court in the case of RUPAN DEOL BAJAJ v. KANWAR PAL SINGH GILL [(1995) 6 SCC194] while considering the interplay between Sections 354 and 509 of the IPC has held as follows:

"....                     ....                 ...."
13. Coming now to the moot point as to whether the above allegations constitute any or all of the offences for which the case was registered, we first turn to Sections 354 and 509 IPC, both of which relate to modesty of woman. These sections read as under:
    "354. Whoever assaults or uses criminal force to any woman, intending to outrage or knowing it to be likely that he will thereby outrage her modesty, shall be punished with imprisonment of either description for a term which may extend to two years, or with fine, or with both.
***

509. Whoever, intending to insult the modesty of any woman, utters any word, makes any sound or gesture, or exhibits any object, intending that such word or sound shall be heard, or that such gesture or object shall be seen, by such woman, or intrudes upon the privacy of such woman, shall be punished with simple imprisonment for a term which may extend to one year, or with fine, or with both."

14. Since the word 'modesty' has not been defined in the Penal Code, 1860 we may profitably look into its dictionary meaning. According to Shorter Oxford English Dictionary (3rd Edn.) modesty is the quality of being modest and in relation to woman means "womanly propriety of behaviour; scrupulous chastity of thought, speech and conduct". The word 'modest' in relation to woman is defined in the above dictionary as "decorous in manner and conduct; not forward or lewd; shamefast". Webster's Third New International Dictionary of the English Language defines modesty as "freedom from coarseness, indelicacy or indecency; a regard for propriety in dress, speech or conduct". In the Oxford English Dictionary (1933 Edn.) the meaning of the word 'modesty' is given as "womanly propriety of behaviour; scrupulous chastity of thought, speech and conduct (in man or woman); reserve or sense of shame proceeding from instinctive aversion to impure or coarse suggestions".

15. In State of Punjab v. Major Singh [AIR 1967 SC 63 : 1967 Cri LJ 1 : 1966 Supp SCR 286] a question arose whether a female child of seven and a half months could be said to be possessed of 'modesty' which could be outraged. In answering the above question Mudholkar, J., who along with Bachawat, J. spoke for the majority, held that when any act done to or in the presence of a woman is clearly suggestive of sex according to the common notions of mankind that must fall within the mischief of Section 354 IPC. Needless to say, the "common notions of mankind" referred to by the learned Judge have to be gauged by contemporary societal standards. The other learned Judge (Bachawat, J.) observed that the essence of a woman's modesty is her sex and from her very birth she possesses the modesty which is the attribute of her sex. From the above dictionary meaning of 'modesty' and the interpretation given to that word by this Court in Major Singh case [AIR 1967 SC 63 : 1967 Cri LJ 1 : 1966 Supp SCR 286] it appears to us that the ultimate test for ascertaining whether modesty has been outraged is the action of the offender such as could be perceived as one which is capable of shocking the sense of decency of a woman. When the above test is applied in the present case, keeping in view the total fact situation, it cannot but be held that the alleged act of Mr Gill in slapping Mrs Bajaj on her posterior amounted to "outraging of her modesty" for it was not only an affront to the normal sense of feminine decency but also an affront to the dignity of the lady — "sexual overtones" or not, notwithstanding."

(Emphasis supplied)

The Apex Court holds that modesty has not been defined under the Code, but the modesty is the quality of being modest and in relation to woman means "womanly propriety of behavior; scrupulous chastity of thought, speech and conduct". The Apex Court again in the case of RAJU PANDURANG MAHALE v. STATE OF MAHARASHTRA [(2004) 4 SCC 371] considered modesty qua the woman while interpreting Section 509 of the IPC. It holds as follows:

"....                 ....             ....

12. What constitutes an outrage to female modesty is nowhere defined. The essence of a woman's modesty is her sex. The culpable intention of the accused is the crux of the matter. The reaction of the woman is very relevant, but its absence is not always decisive. Modesty in this section is an attribute associated with female human beings as a class. It is a virtue which attaches to a female owing to her sex. The act of pulling a woman, removing her saree, coupled with a request for sexual intercourse, is such as would be an outrage to the modesty of a woman; and knowledge, that modesty is likely to be outraged, is sufficient to constitute the offence without any deliberate intention having such outrage alone for its object. As indicated above, the word "modesty" is not defined in IPC. The Shorter Oxford Dictionary (3rd Edn.) defines the word "modesty" in relation to a woman as follows:

"Decorous in manner and conduct; not forward or lewd; Shamefast; Scrupulously chaste."

13. Modesty is defined as the quality of being modest; and in relation to a woman, "womanly propriety of behaviour; scrupulous chastity of thought, speech and conduct". It is the reserve or sense of shame proceeding from instinctive aversion to impure or coarse suggestions. As observed by Justice Patteson in R. v. James Lloyd [(1836) 7 C&P 317 : 173 ER 141] :

In order to find the accused guilty of an assault with intent to commit a rape, court must be satisfied that the accused, when he laid hold of the prosecutrix, not only desired to gratify his passions upon her person but that he intended to do so at all events, and notwithstanding any resistance on her part.

The point of distinction between an offence of attempt to commit rape and to commit indecent assault is that there should be some action on the part of the accused which would show that he was just going to have sexual connection with her.

14.Webster's Third New International Dictionary of the English language defines modesty as “freedom from coarseness, indelicacy or indecency : a regard for propriety in dress, speech or conduct”. In the Oxford English Dictionary (1933 Edn.), the meaning of the word “modesty” is given as “womanly propriety of behaviour; scrupulous chastity of thought, speech and conduct (in man or woman); reserve or sense of shame proceeding from instinctive aversion to impure or coarse suggestions”.

Long before the aforementioned two judgments rendered by the Apex Court, the Apex Court in the case of STATE OF PUNJAB v. MAJOR SINGH [1966 SCC OnLine SC 51] has considered the importance of Section 509 of the IPC therein and has held as follows:

“....                     ....                     ....

4. Intention and knowledge are of course states of mind. They are nonetheless facts which can be proved. They cannot be proved by direct evidence. They have to be inferred from the circumstances of each case. Such an inference, one way or the other, can only be made if a reasonable man would, on the facts of the case, make it. The question in each case must, in my opinion, be : will a reasonable man think that the act was done with the intention of outraging the modesty of the woman or with the knowledge that it was likely to do so? The test of the outrage of modesty must, therefore, be whether a reasonable man will think that the act of the offender was intended to or was known to be likely to outrage the modesty of the woman. In considering the question, he must imagine the woman to be a reasonable woman and keep in view all circumstances concerning her, such as, her station and way of life and the known notions of modesty of such a woman. The expression "outrage her modesty" must be read with the words "intending to or knowing it to be likely that he will". So read, it would appear that though the modesty to be considered is of the woman concerned, the word "her" was not used to indicate her reaction. Read all together, the words indicate an act done with the intention or knowledge that it was likely to outrage the woman's modesty, the emphasis being on the intention and knowledge.

10. It has been found as a fact by the courts below that the respondent had caused injuries to the vagina of a seven and a half month old child by fingering. He has been held guilty of an offence under Section 323 of the Indian Penal Code. The contention on behalf of the State who is the appellant before us is that the offence amounts to outraging the modesty of a woman and is thus punishable under Section 354 of the Indian Penal Code. The learned Sessions Judge and two of the three learned Judges of the High Court who heard the appeal against the decision of the Sessions Judge were of the view that a child seven and a half month old being incapable of having a developed sense of modesty, the offence was not punishable under Section 354. The third learned Judge, Gurdev Singh, J., however, took a different view, behaviour, scrupulous chastity of thought, speech and conduct (in men or women) reserve or sense of shame proceeding from instinctive aversion to impure or coarse suggestions - and observed:"This obviously does not refer to a particular woman but to the accepted notions of womanly behaviour and conduct. It is in this sense that the modesty appears to have been used in Section 354 of the Indian Penal Code". The learned Judge then referred to Section 509 of the Penal Code

in which also the word “modesty” appears and then proceeded to say:

“The object of this provision seems to have been to protect women against indecent behaviour of others which is offensive to morality. The offences created by Section 354 and Section 509 of the Indian Penal Code are as much in the interest of the woman concerned as in the interest of public morality and decent behaviour. These offences are not only offences against the individual but against public morals and society as well, and that object can be achieved only if the word 'modesty' is considered to be an attribute of a human female irrespective of fact whether the female concerned has developed enough understanding as to appreciate the nature of the act or to realise that it is offensive to decent female behaviour or sense of propriety concerning the relations of a female with others.”

...                ...                ...”

(Emphasis supplied)

In the light of the judgments of the Apex Court, the plea put forth by the petitioner that it was only a writing on the wall and no offence can be made out or CW-5’s statement that led the offence having committed by him are all factors, which cannot be considered in exercise of jurisdiction under Section 482 of the Cr.P.C. It is for the petitioner to come out clean in a full blown trial.

14. It needs no emphasis that sexual violence against a woman apart from being a de-humanising act is intrusion into the right to privacy of the said woman, which can by no stretch of imagination be construed to be lawful. It leaves the woman to undergo traumatic experience. Therefore, such cases which are brought before the Court needs to be dealt sternly. Causing physical harm on a woman is altogether different circumstance and punishable with different offences but intruding into the victim’s privacy, personal integrity would cause a serious psychological harm which sometimes generates much pain to a woman than causing physical harm, as it scars the soul. Therefore, any scatological or salacious statements made against a woman either by gesture, writing or speaking, would undoubtedly amount to insulting the modesty of a woman. In today’s digital age one need not cause physical harm, a woman’s modesty can be railroaded by sheer circulation of pejorative statements, pictures or videos in the social media. It is therefore, when such cases are projected before this Court seeking quashment, it should not be interfered with, but be dealt with a stern manner. The petitioner has indulged in one of the ingredients of such insult by fresco or a writing on the wall. He, therefore, cannot get away with making such belitting comments on a woman in public.

15. It is open to the prosecution to invoke Section 319 of the Cr.P.C. to include CW-5 into the array of accused after following due process of law. In the light of preceding analysis, the ingredients of Section 509 of the IPC are clearly met. Same goes with Sections 501, 504 and 507 of the IPC.

16. For the aforesaid reasons, finding no merit in the petition, the petition stands rejected.

The petitioner, sole accused in S.C.No.859 of 2023 pending before the XLV Additional City Civil and Sessions Judge, Bengaluru arising out of crime in Crime No.47 of 2023 registered for offences under Sections 498A, 306 and 34 of the IPC is before this Court calling in question the entire proceedings.

2. Sans details, facts germane are as follows:-

The 2nd respondent is the complainant, father-in-law of the petitioner. The petitioner gets married to one Piyali Mukherjee ('the victim'), the daughter of the complainant on 05-02-2021. It appears that the relationship between the two turned completely sore and on several grievances, she commits suicide by hanging herself on 24-02-2023. The 2nd respondent/father then registers a complaint against the husband, mother-in-law and father-in-law of the deceased for having abetted the suicide of the victim on demand of dowry. The complaint is registered on 26-02-2023 which results in a crime in Crime No.47 of 2023. The police conduct investigation and file a charge sheet. While filing the charge sheet the father-in-law and mother-in-law of the deceased are dropped as nothing was found against them and charge sheet is filed only against the petitioner/husband. The matter is committed to the Court of Sessions where it is registered as S.C.No.859 of 2023. On 23-08-2023 the Court of Sessions directs the matter to be posted for framing of charges. It is at that juncture the petitioner knocks the doors of this Court in the subject petition.

3. Heard Sri Sandesh J. Chouta, learned senior counsel appearing for the petitioner, Sri P. Thejesh, learned High Court Government Pleader appearing for respondent No.1 and Smt J. Deepa, learned counsel appearing for respondent No.2.

4. The learned senior counsel Sri Sandesh J.Chouta submits that the victim by herself was suffering from depression. She has shot a video of her suicide, transcript of which clearly indicates that she is blaming none in the family. She further says that no action should be taken against the husband or in-laws as she is committing suicide on such depression. The learned senior counsel would further submit that there is neither goading, instigation nor proximity to the death of the victim. He would contend that the issue in the lis stands completely covered by what this Court has held in DAVID D’SOUZA v. STATE OF KARNATAKA [2024 SCC OnLine Kar.47]. The learned senior counsel submits that this Court in David D’Souza’s case has considered the entire spectrum of the law and, therefore, he would not rely on any other judgment qua the offence punishable under Section 306 of the IPC. Insofar as the offence under Section 498A of the IPC is concerned, the learned senior counsel would submit that there is not even a single ingredient of demand of dowry in the complaint, except harassment now and then, as noted by the victim in her diary. Insofar as Section 498A is concerned, the learned senior counsel would place reliance upon the judgment of the Apex Court in the case of ACHIN GUPTA v. STATE OF HARYANA [2024 SCC OnLine SC 759]. He would seek quashment of the proceedings placing reliance upon the aforesaid two judgments and on emphasizing the fact that the petitioner/husband has never instigated the victim to commit suicide.
