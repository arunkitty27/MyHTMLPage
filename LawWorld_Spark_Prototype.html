While filing the charge sheet, the officer in-charge of the Police Station drops accused 2 and 3 holding that there was no evidence against them for the offences so alleged. Therefore, the charge sheet is filed only against the petitioner/husband. In the teeth of the aforesaid facts, whether it amounts to ingredients of Section 306 of the IPC is required to be noticed.
9. Section 306 of the IPC punishes any person who abets commission of suicide. Therefore, abetment is the soul of Section 306. ‘Abetment’ is defined under Section 107 of the IPC. Therefore, it becomes necessary to notice both Sections 306 and 107 of the IPC. They read as follows:

“306. Abetment of suicide.—If any person commits suicide, whoever abets the commission of such suicide, shall be punished with imprisonment of either description for a term which may extend to ten years, and shall also be liable to fine.”

… … …

107. Abetment of a thing.—A person abets the doing of a thing, who—
First.—Instigates any person to do that thing; or

Secondly.—Engages with one or more other person or persons in any conspiracy for the doing of that thing, if an act or illegal omission takes place in pursuance of that conspiracy, and in order to the doing of that thing; or

Thirdly.—Intentionally aids, by any act or illegal omission, the doing of that thing.

Explanation 1.—A person who, by wilful misrepresentation, or by wilful concealment of a material fact which he is bound to disclose, voluntarily causes or procures, or attempts to cause or procure, a thing to be done, is said to instigate the doing of that thing.

Illustration

A, a public officer, is authorised by a warrant from a Court of Justice to apprehend Z. B, knowing that fact and also that C is not Z, wilfully represents to A that C is Z, and thereby intentionally causes A to apprehend C. Here B abets by instigation the apprehension of C.

Explanation 2.—Whoever, either prior to or at the time of the commission of an act, does anything in order to facilitate the commission of that act, and thereby facilitates the commission thereof, is said to aid the doing of that act.”

For an offence to become punishable under Section 306 of the IPC, it is necessary that it has the ingredients of Section 107 of the IPC to become abetment of suicide. The interpretation of abetment need not detain this Court for long or delve deep into the matter. Plethora of judgments are rendered by the Apex Court as to what constitutes abetment. All of which bear consideration in the judgment rendered in David D’Souza case supra. The judgments relied on in the case of David D’Souza are as follows:-

(1) SWAMY PRAHALADDAS V. STATE OF M.P. [1995 Supp (3) SCC 438]

(2) SANJU V. STATE OF M.P. [ (2002) 5 SCC 371]

(3) S.S. CHHEENA V. VIJAY KUMAR MAHAJAN [ (2010) 12 SCC 190]

(4) AMALENDU PAL V. STATE OF WEST BENGAL [ (2010) 1 SCC 707]

(5) GURCHARAN SINGH V. STATE Of PUNJAB [ (2020) 10 SCC 200]

(6) KANCHAN SHARMA v. STATE Of UTTAR PRADESH [2021 SCC OnLine SC 737]

(7) DAXABEN v. STATE Of GUJARAT [2022 SCC OnLine SC 936]

(8) KUMAR @ SHIVA KUMAR v. STATE OF KARNATAKA [2024 SCC OnLine SC 216]

(9) MAHMOOD ALI v. STATE Of U.P. [2023 SCC OnLine SC 950]

(10) STATE Of HARYANA v. BHAJAN LAL [1992 Supp (1) SCC 335]

All the judgments so relied on by this Court in the aforesaid judgment were concerning statement being made by the accused to the victim to “go and die”. That would not amount to an offence under Section 306 of the IPC is what is held. To hold thus, this Court had considered the facts therein observing that there was neither instigation nor goading nor proximity with the crime.

10. In the case at hand, it is not that there was no instigation or no goading. The issue in the lis concerns the happenings between the husband and the wife. The wife is crying foul right from the day of marriage or thereafter when they shifted to Bengaluru that the husband had extra-marital affair. If this were to be imaginary, it would have been an altogether different circumstance. The imagination has led to the victim scripting several pages in her diary and also shooting a video of her suicide. All the blame is on the husband. In the life of husband and wife it cannot be said that there should be minimum proximity. The wife being driven to the wall to an extent of commission of suicide cannot happen at the spur of the moment. It is a collection of agony that has resulted in the fateful incident. It is akin to the explosion of a dormant volcano. Instigation or otherwise of a husband for commission of suicide of the wife can only be deciphered in a full blown trial; it would undoubtedly require evidence, as the truth between the husband and the wife will not come out in a petition under Section 482 of the Cr.P.C. unless there is a trial conducted. Goading and instigation could be throughout the days. It is not that the marriage had taken place 10 years ago. The marriage prior to the death of the victim was 24 months old and the video and writings are clear that there was clear instigation on the part of the husband albeit prima facie, at this juncture. These are matters which require a full blown trial.

11. None of the judgments that the learned senior counsel would seek to place reliance upon, which all have been considered in the case of David D’Souza, would become applicable to the facts of the case at hand. On the other hand, it becomes germane to notice the judgment of the Apex Court in the case of UDE SINGH v. STATE OF HARYANA [ (2019) 17 SCC 301]. The law concerning abetment is extensively analyzed in the case of UDE SINGH by the Apex Court from paragraphs 15 to 26 and they read as follows:

“.... .... ....

15. Thus, “abetment” involves a mental process of instigating a person in doing something. A person abets the doing of a thing when:
he instigates any person to do that thing; or
he engages with one or more persons in any conspiracy for the doing of that thing; or
he intentionally aids, by acts or illegal omission, the doing of that thing.
These are essential to complete the abetment as a crime. The word “instigate” literally means to provoke, incite, urge on or bring about by persuasion to do anything.

16. In cases of alleged abetment of suicide, there must be a proof of direct or indirect act(s) of incitement to the commission of suicide. It could hardly be disputed that the question of cause of a suicide, particularly in the context of an offence of abetment of suicide, remains a vexed one, involving multifaceted and complex attributes of human behaviour and responses/reactions. In the case of accusation for abetment of suicide, the court would be looking for cogent and convincing proof of the act(s) of incitement to the commission of suicide. In the case of suicide, mere allegation of harassment of the deceased by another person would not suffice unless there be such action on the part of the accused which compels the person to commit suicide; and such an offending action ought to be proximate to the time of occurrence. Whether a person has abetted in the commission of suicide by another or not, could only be gathered from the facts and circumstances of each case.

16.1. For the purpose of finding out if a person has abetted commission of suicide by another, the consideration would be if the accused is guilty of the act of instigation of the act of suicide. As explained and reiterated by this Court in the decisions above referred, instigation means to goad, urge forward, provoke, incite or encourage to do an act. If the persons who committed suicide had been hypersensitive and the action of the accused is otherwise not ordinarily expected to induce a similarly circumstanced person to commit suicide, it may not be safe to hold the accused guilty of abetment of suicide. But, on the other hand, if the accused by his acts and by his continuous course of conduct creates a situation which leads the deceased perceiving no other option except to commit suicide, the case may fall within the four corners of Section 306 IPC. If the accused plays an active role in tarnishing the self- esteem and self-respect of the victim, which eventually draws the victim to commit suicide, the accused may be held guilty of abetment of suicide. The question of mens rea on the part of the accused in such cases would be examined with reference to the actual acts and deeds of the accused and if the acts and deeds are only of such nature where the accused intended nothing more than harassment or snap show of anger, a particular case may fall short of the offence of abetment of suicide. However, if the accused kept on irritating or annoying the deceased by words or deeds until the deceased reacted or was provoked, a particular case may be that of abetment of suicide. Such being the matter of delicate analysis of human behaviour, each case is required to be examined on its own facts, while taking note of all the surrounding factors having bearing on the actions and psyche of the accused and the deceased.

16.2. We may also observe that human mind could be affected and could react in myriad ways; and impact of one's action on the mind of another carries several imponderables. Similar actions are dealt with differently by different persons; and so far a particular person's reaction to any other human's action is concerned, there is no specific theorem or yardstick to estimate or assess the same. Even in regard to the factors related with the question of harassment of a girl, many factors are to be considered like age, personality, upbringing, rural or urban set-ups, education, etc. Even the response to the ill action of eve teasing and its impact on a young girl could also vary for a variety of factors, including those of background, self-confidence and upbringing. Hence, each case is required to be dealt with on its own facts and circumstances.
17. Having taken an overall view of the applicable principles, we may notice that the real questions arising in this appeal are:
17.1. Whether the accused persons are guilty of the acts and utterances attributed to them.

17.2. If the answer to Question (i) is in the affirmative, as to whether such acts and utterances had only been of insult or intimidation or had been of instigation; and whether such acts and utterances amounted to abetment of suicide?

18. Before entering into the questions aforesaid, it may be observed that the fact that the daughter of the complainant indeed committed suicide with hanging by neck is not of any dispute in this appeal. The fact has been established on record and the trial court as also the High Court have concurrently found this fact proved. No further dilation on this aspect of the matter is requisite. Similarly, a feeble suggestion on behalf of the accused persons that Accused 3 and 4 were not present in the village on 5-5-1996 does not carry any substance and the finding in that regard is also not required to be interfered with.

19. Coming to the material points for determination in the matter, the question as to whether the accused persons were guilty of the actions and utterances imputed on them does not detain us much longer. The fact that they indeed did so and made such utterances is amply established in the testimony of the prosecution witnesses, particularly PW 1, PW 2 and PW 11, as noticed above. It is also established beyond doubt that such utterances were not of a solitary or one-off incident but the accused, working in unison, had continuously made the imputed utterances towards the daughter of the complainant and continuously taunted the girl, who committed suicide next day after her last encounter with the accused. In the given fact situation, the question is as to whether such actions and utterances of the accused persons lead to the offence of abetment of suicide or only to the offence of insult and/or intimidation?

20. Having examined the record in its totality, we are clearly of the view that the actions and utterances of the accused, directed towards the deceased on continuous basis, had driven her to suicide; and accused persons are guilty of the offence of abetment of suicide.

21. The relevant background aspects of the matter make it clear that the complainant (father of the deceased) and the accused persons, residing in the same village in the State of Haryana, were closely related as cousins but were estranged in relations; and were involved in several civil and criminal cases against each other. Admittedly, there was a property dispute between the parties that was later on compromised but, the relations of the parties did not improve. There was a criminal case by Accused 1 (since deceased) against the complainant and his brother, allegedly involving offence under Section 307 IPC. Then, there was another criminal case wherein wife of the complainant (PW 11 Smt Krishna) alleged that Accused 1 of this case had assaulted her with gandasa. The incident of 15-4-1996 (when the deceased girl was dragged by Accused 1) had allegedly taken place after evidence in the said criminal case lodged by the mother of the deceased girl. The parties, therefore, were not standing on good terms and there had been the elements of rather abject animosity towards each other. On the other hand, the position of the deceased girl had been that she was about 18 years of age; she had failed to clear her 10th standard examination and was practically a drop out from her studies; and she was engaged for the purpose of marriage but, six months before the incident in question, her engagement had broken. Accused 1 and 2 were uncles in her relation whereas, Accused 3 and 4 were her cousins.

22. In the given set-up and the respective position of the parties, if Accused 1 continuously addressed or called the deceased girl as his "wife", in our view, the utterance was not merely of teasing but of demeaning and destroying the self-esteem of the young girl whose engagement had broken and whose uncle was mocking her to join him in matrimony. It was the act of humiliation of highest order for the girl, who had personally suffered the set-back of broken engagement, apart from that she was unable to clear even 10th standard examination. Obviously, she was being ridiculed and taunted for her broken engagement. The other accused persons chose to join Accused 1 and aggravated the humiliation of the girl by addressing her as younger brother's wife or aunt. There remains nothing to doubt that the accused persons were working with the common intention to harass and humiliate the girl with reference to her broken engagement. The significant part of the matter is that such taunting and humiliation of the deceased at the hands of the accused persons had not been a singular event or one-off affair but had been a continuous feature, as amply established by the prosecution witnesses. The incident of 5-5-1996 drew the final straw when the hapless girl received the same taunts from the accused persons and she even rebuked them. We find no reason to disbelieve the statement of PW 2 Jai Narain as regards the incident of 5-5-1996. Equally, there is no reason to disbelieve the statement of PW 11 Smt Krishna that her daughter wept the whole night after the said incident; and on being frustrated and exasperated with such humiliations, expressed her intention to end her life. The fact of the matter remains that the victim girl ended her life in the early morning very next day.

23. Taking an overall view of the matter, we are satisfied that the present one had not been a case of a mere eve teasing, insult or intimidation but the continuous and repeated acts and utterances of the accused persons were calculated to bring disgrace to the village girl and to destroy her self-esteem; rather the acts and utterances were aimed at taking her to the brink of helplessness and to the vanishing point of tolerance. It had not been a case of mere intimidation or insult. The incessant intimidation and insult of the innocent girl had been of instigation; and such instigation clearly answers to the description of abetment of suicide. Therefore, in our view, Accused 1 and 3 have rightly been held guilty of offence of abetment of suicide.

24.The contention of the appellants that their intention had never been to make her commit suicide is required to be rejected because, as noticed above, the hapless girl was intentionally chosen for humiliation by the accused, who were otherwise involved in several litigations with her parents. The accused persons also knew it that the father of the girl was posted in his duty outside the village. As noticed, the intention of the accused had only been to drive the deceased to the brink of helplessness and intolerance; they in fact succeeded in doing so on 5-5-1996, when the girl rebuked them for their utterances. However, the victim girl found no way out because the humiliation at the hands of the accused had been everyday affair; and, in the given set-up of the society she belonged to, any action against the accused by her family was being avoided for the sake of her honour. 

25. The present case indeed represents a sordid state of affairs in relation to the young girl in the rural setting, whose honour and self-esteem got brutally violated by none other but her own relatives, who found her to be the soft target to settle their scores with her parents. The accused rather exhibited their denigrating mentality while targeting the young girl, who was otherwise required to be treated by them with affection and respect, for being their niece and their cousin. The facts of this case lead only to the conclusion that the accused persons had intentionally, with their incessant acts and utterances, goaded the victim girl to commit suicide. She indeed committed suicide within few hours of her last and unbearable encounter with the accused. The acts and deeds of the accused in the evening of 5-5-1996 had been too proximate to the event of suicide by 9 a.m. in the morning of 6-5-1996. As testified by PW 11 Smt Krishna, her daughter cried the whole night for being unable to bear the daily humiliation at the hands of the accused and ended her life in the morning.


26. For what has been discussed hereinabove and having examined the matter in its totality, we find no reason to consider any interference in the impugned judgment and order dated 5-5-2008 [Hem Karan v. State of Haryana, 2008 SCC OnLine P&H 659] in relation to Appellants 1 and 3.""

                                                                               (Emphasis supplied)

The Apex Court, taking overall view of the matter before it, holds that it was not a matter of eve teasing of the victim girl. Insult, intimidation and utterances of the accused persons were calculated to bring disgrace and destroy her self-esteem. Continuance of repeated acts and utterances are what formed the crux of the judgment of the Apex Court in the case of UDE SINGH which would become applicable to the facts of the case at hand as well. Reference being made to another judgment of the Apex Court in the case of MAHENDRA K.C. v. STATE OF KARNATAKA [(2022) 2 SCC 129] which was also concerning an offence under Section 306 of the IPC would become apposite. The Apex Court holds as follows:

“C. Analysis
16. On reading the judgment [L. Bheema Naik v. State of Karnataka, 2020 SCC OnLine Kar 3395] of the Single Judge, it would appear that the Single Judge has failed to notice the distinction between a petition for quashing under Section 482 (which was being considered) and a criminal trial or an appeal against a conviction on a charge under Section 306. The Single Judge has transgressed the limits of the jurisdiction under Section 482 CrPC. The judgment is replete with hypotheses and surmises on the basis of which the Single Judge has reached an inference on facts. The Single Judge has tested the veracity of the allegations in the criminal complaint and in the suicide note left behind by the deceased without having the benefit of an evidentiary record which would be collected during the trial. At the stage when the High Court considers a petition for quashing under Section 482 CrPC, the test to be applied is whether the allegations in the complaint as they stand, without adding or detracting from the complaint, prima facie establish the ingredients of the offence alleged. At this stage, the High Court cannot test the veracity of the allegations nor for that matter can it proceed in the manner that a Judge conducting a trial would, on the basis of the evidence collected during the course of trial. The High Court in the present case has virtually proceeded to hold a trial, substituting its own perception for what it believed should or should not have been the normal course of human behaviour. This is clearly impermissible.

.... .... ....

18. In this backdrop, it is impossible on a judicious purview of the contents of the complaint and the suicide note for a judicial mind to arrive at a conclusion that a case for quashing the FIR had been established. In arriving at that conclusion, the Single Judge has transgressed the well-settled limitations on the exercise of the powers under Section 482 CrPC and has encroached into a territory which is reserved for a criminal trial.
19. The High Court has the power under Section 482 to issue such orders as are necessary to prevent the abuse of legal process or otherwise, to secure the ends of justice. The law on the exercise of power under Section 482 to quash an FIR is well-settled. In State of Orissa v. Saroj Kumar Sahoo [State of Orissa v. Saroj Kumar Sahoo, (2005) 13 SCC 540: (2006) 2 SCC (Cri) 272] , a two-Judge Bench of this Court, observed that: (SCC pp. 547-48, para 8)
“8. … While exercising the powers under the section, the court does not function as a court of appeal or revision. Inherent jurisdiction under the section though wide has to be exercised sparingly, carefully and with caution and only when such exercise is justified by the tests specifically laid down in the section itself. It is to be exercised ex debito justitiae to do real and substantial justice for the administration of which alone the courts exist. Authority of the court exists for advancement of justice and if any attempt is made to abuse that authority so as to produce injustice, the court has power to prevent abuse. It would be an abuse of process of the court to allow any action which would result in injustice and prevent promotion of justice. In exercise of the powers the court would be justified to quash any proceeding if it finds that initiation/continuance of it amounts to abuse of the process of court or quashing of these proceedings would otherwise serve the ends of justice. When no offence is disclosed by the report, the court may examine the question of fact. When a report is sought to be quashed, it is permissible to look into the materials to assess what the report has alleged and whether any offence is made out even if the allegations are accepted in toto.”
20. These principles emanate from the decisions of this Court in State of Haryana v. Bhajan Lal [State of Haryana v. Bhajan Lal, 1992 Supp (1) SCC 335: 1992 SCC (Cri) 426] and State of M.P. v. Surendra Kori [State of M.P. v. Surendra Kori, (2012) 10 SCC 155: (2012) 4 SCC (Civ) 921 : (2013) 1 SCC (Cri) 247: (2012) 2 SCC (L&S) 940]. In Surendra Kori [State of M.P. v. Surendra Kori, (2012) 10 SCC 155: (2012) 4 SCC (Civ) 921: (2013) 1 SCC (Cri) 247: (2012) 2 SCC (L&S) 940], this Court observed: (Surendra Kori case [State of M.P. v. Surendra Kori, (2012) 10 SCC 155: (2012) 4 SCC (Civ) 921 : (2013) 1 SCC (Cri) 247: (2012) 2 SCC (L&S) 940], SCC p. 163, para 14)

“14. The High Court in exercise of its powers under Section 482 CrPC does not function as a court of appeal or revision. This Court has, in several judgments, held that the inherent jurisdiction under Section 482 CrPC, though wide, has to be used sparingly, carefully and with caution. The High Court, under Section 482 CrPC, should normally refrain from giving a prima facie decision in a case where the entire facts are incomplete and hazy, more so when the evidence has not been collected and produced before the Court and the issues involved, whether factual or legal, are of wide magnitude and cannot be seen in their true perspective without sufficient material.”

21. In Bhajan Lal [State of Haryana v. Bhajan Lal, 1992 Supp (1) SCC 335 : 1992 SCC (Cri) 426] , this Court laid down the principles for the exercise of the jurisdiction by the High Court in exercise of its powers under Section 482 CrPC to quash an FIR. Ratnavel Pandian, J. laid down the limits on the exercise of the power under Section 482 CrPC for quashing the FIR and observed : (SCC pp. 378-79, para 102)

“102. In the backdrop of the interpretation of the various relevant provisions of the Code under Chapter XIV and of the principles of law enunciated by this Court in a series of decisions relating to the exercise of the extraordinary power under Article 226 or the inherent powers under Section 482 CrPC which we have extracted and reproduced above, we give the following categories of cases by way of illustration wherein such power could be exercised either to prevent abuse of the process of any court or otherwise to secure the ends of justice, though it may not be possible to lay down any precise, clearly defined and sufficiently channelised and inflexible guidelines or rigid formulae and to give an exhaustive list of myriad kinds of cases wherein such power should be exercised.”

(1) Where the allegations made in the first information report or the complaint, even if they are taken at their face value and accepted in their entirety do not prima facie constitute any offence or make out a case against the accused.

(2) Where the allegations in the first information report and other materials, if any, accompanying the FIR do not disclose a cognizable offence, justifying an investigation by police officers under Section 156(1) CrPC except under an order of a Magistrate within the purview of Section 155(2) CrPC.

(3) Where the uncontroverted allegations made in the FIR or complaint and the evidence collected in support of the same do not disclose the commission of any offence and make out a case against the accused.

(4) Where, the allegations in the FIR do not constitute a cognizable offence but constitute only a non-cognizable offence, no investigation is permitted by a police officer without an order of a Magistrate as contemplated under Section 155(2) CrPC.

(5) Where the allegations made in the FIR or complaint are so absurd and inherently improbable on the basis of which no prudent person can ever reach a just conclusion that there is sufficient ground for proceeding against the accused.

(6) Where there is an express legal bar engrafted in any of the provisions of the Code or the Act concerned (under which a criminal proceeding is instituted) to the institution and continuance of the proceedings and/or where there is a specific provision in the Code or the concerned Act, providing efficacious redress for the grievance of the aggrieved party.

(7) Where a criminal proceeding is manifestly attended with mala fide and/or where the proceeding is maliciously instituted with an ulterior motive for wreaking vengeance on the accused and with a view to spite him due to private and personal grudge."

The judgment in Bhajan Lal [State of Haryana v. Bhajan Lal, 1992 Supp (1) SCC 335 : 1992 SCC (Cri) 426] has been recently relied on by this Court in State of Telangana v. Managipet[State of Telangana v. Managipet, (2019) 19 SCC 87 : (2020) 3 SCC (Cri) 702] .

22. Based on the above precedent, the High Court while exercising its power under Section 482 CrPC to quash the FIR instituted against the second respondent- accused should have applied the following two tests : (i) whether the allegations made in the complaint, prima facie constitute an offence; and (ii) whether the allegations are so improbable that a prudent man would not arrive at the conclusion that there is sufficient ground to proceed with the complaint. Before proceeding further, it is imperative to briefly discuss the law on the abetment of suicide to determine if a prima facie case under Section 306 IPC has been made out against the respondent- accused.

23. Section 306 IPC provides for punishment of the abetment of suicide:

“306. Abetment of suicide.—If any person commits suicide, whoever abets the commission of such suicide, shall be punished with imprisonment of either description for a term which may extend to ten years, and shall also be liable to fine.”

Section 107 IPC defines the expression “abetment”:
“107. Abetment of a thing.—A person abets the doing of a thing, who—

First.—Instigates any person to do that thing; or

Secondly.—Engages with one or more other person or persons in any conspiracy for the doing of that thing, if an act or illegal omission lakes place in pursuance of that conspiracy, and in order to the doing of that thing; or

Thirdly.—Intentionally aids, by any act or illegal omission, the doing of that thing.

Explanation 1.—A person who by wilful misrepresentation, or by wilful concealment of a material fact which he is bound to disclose, voluntarily causes or procures, or attempts to cause or procure, a thing to be done, is said to instigate the doing of that thing.”

24. The essence of abetment lies in instigating a person to do a thing or the intentional doing of that thing by an act or illegal omission. In Ramesh Kumar v. State of Chhattisgarh [Ramesh Kumar v. State of Chhattisgarh, (2001) 9 SCC 618 : 2002 SCC (Cri) 1088] , a three-Judge Bench of this Court, speaking through R.C. Lahoti, J. (as the learned Chief Justice then was), observed : (SCC p. 629, para 20)

“20. Instigation is to goad, urge forward, provoke, incite or encourage to do "an act". To satisfy the requirement of instigation though it is not necessary that actual words must be used to that effect or what constitutes instigation must necessarily and specifically be suggestive of the consequence. Yet a reasonable certainty to incite the consequence must be capable of being spelt out. The present one is not a case where the accused had by his acts or omission or by a continued course of conduct created such circumstances that the deceased was left with no other option except to commit suicide in which case an instigation may have been inferred. A word uttered in the fit of anger or emotion without intending the consequences to actually follow cannot be said to be instigation."

25. A two-Judge Bench of this Court in Chitresh Kumar Chopra v. State (NCT of Delhi) [Chitresh Kumar Chopra v. State (NCT of Delhi), (2009) 16 SCC 605 : (2010) 3 SCC (Cri) 367] , speaking through D.K. Jain, J., observed : (SCC pp. 611-12, paras 19-20)

"19. As observed in Ramesh Kumar [Ramesh Kumar v. State of Chhattisgarh, (2001) 9 SCC 618 : 2002 SCC (Cri) 1088] , where the accused by his acts or by a continued course of conduct creates such circumstances that the deceased was left with no other option except to commit suicide, an "instigation" may be inferred. In other words, in order to prove that the accused abetted commission of suicide by a person, it has to be established that:

(i) the accused kept on irritating or annoying the deceased by words, deeds or wilful omission or conduct which may even be a wilful silence until the deceased reacted or pushed or forced the deceased by his deeds, words or wilful omission or conduct to make the deceased move forward more quickly in a forward direction; and

(ii) that the accused had the intention to provoke, urge or encourage the deceased to commit suicide while acting in the manner noted above. Undoubtedly, presence of mens rea is the necessary concomitant of instigation.

20. In the background of this legal position, we may advert to the case at hand. The question as to what is the cause of a suicide has no easy answers because suicidal ideation and behaviours in human beings are complex and multifaceted. Different individuals in the same situation react and behave differently because of the personal meaning they add to each event, thus accounting for individual vulnerability to suicide. Each individual's suicidality pattern depends on his inner subjective experience of mental pain, fear and loss of self-respect. Each of these factors are crucial and exacerbating contributor to an individual's vulnerability to end his own life, which may either be an attempt for self-
protection or an escapism from intolerable self.”

                                                                           (emphasis in original)

26. This has been reiterated in the decision in Amalendu Pal v. State of W.B. [Amalendu Pal v. State of W.B., (2010) 1 SCC 707: (2010) 1 SCC (Cri) 896] , where it has been observed : (SCC p. 712, para 12)

“12. … It is also to be borne in mind that in cases of alleged abetment of suicide there must be proof of direct or indirect acts of incitement to the commission of suicide. Merely on the allegation of harassment without there being any positive action proximate to the time of occurrence on the part of the accused which led or compelled the person to commit suicide, conviction in terms of Section 306 IPC is not sustainable.”
(See also in this context the judgments in Praveen Pradhan v. State of Uttaranchal [Praveen Pradhan v. State of Uttaranchal,(2012) 9 SCC 734: (2013)1 SCC (Cri) 146], Vaijnath Kondiba Khandke v. State of Maharashtra [Vaijnath Kondiba Khandke v. State of Maharashtra, (2018) 7 SCC 781: (2018) 3 SCC (Cri) 362], M. Arjunan v. State [M. Arjunan v. State, (2019) 3 SCC 315: (2019) 2 SCC (Cri) 219], Ude Singh v. State of Haryana [Ude Singh v. State of Haryana, (2019) 17 SCC 301:(2020) 3 SCC (Cri) 306], Rajesh v. State of Haryana [Rajesh v. State of Haryana, (2020) 15 SCC 359: (2020) 4 SCC (Cri) 75] and Gurcharan Singh v. State of Punjab [Gurcharan Singh v. State of Punjab, (2020) 10 SCC 200: (2021) 1 SCC (Cri) 417]. These decisions have been recently referred to in the judgment of this Court in Arnab Manoranjan Goswami v. State of Maharashtra [Arnab Manoranjan Goswami v. State of Maharashtra, (2021) 2 SCC 427: (2021) 1 SCC (Cri) 834] ).

27. While adjudicating on an application under Section 482 CrPC, the High Court in the present case travelled far away from the parameters for the exercise of the jurisdiction. Essentially, the task before the High Court was to determine whether the allegations made in the first information report or the complaint, even if they are taken at their face value and accepted in their entirety did or did not prima facie constitute an offence or make out a case against the accused.

28. Instead of applying this settled principle, the High Court has proceeded to analyse from its own perspective the veracity of the allegations. It must be emphasised that this is not a case where the High Court has arrived at a conclusion that the allegations in the FIR or the complaint are so absurd and inherently improbable on the basis of which no prudent person could ever reach a just conclusion that there is sufficient ground for proceeding against the accused. Nor is this a case where the criminal proceeding is manifestly mala fide or has been instituted with an ulterior motive of taking vengeance on the accused. On the contrary, the specific allegations in the FIR and in the complaint find due reflection in the suicide note and establish a prima facie case for abetment of suicide within the meaning of Sections 306 and 107 IPC. The entire judgment [L. Bheema Naik v. State of Karnataka, 2020 SCC OnLine Kar 3395] of the High Court consists of a litany of surmises and conjectures and such an exercise is beyond the domain of proceeding under Section 482 CrPC. The High Court has proceeded to scrutinise what has been disclosed during the investigation, ignoring that the investigation had been stayed by an interim order of the High Court, during the pendency of the proceedings under Section 482.

29. The High Court observed that a prima facie case for the commission of offence under Section 306 IPC is not made out since : (i) the suicide note does not describe the specific threats; (ii) details of the alleged demand of Rs 8 lakhs from the deceased by the respondent-accused are not set out in the suicide note; and (iii) no material to corroborate the allegations detailed in the suicide note has been unearthed by the investigating agency. The High Court observed that since the deceased took considerable time to write a twelve page suicide note, "it would have been but natural for the author to set out the details". The High Court has evidently travelled far beyond the limits of its inherent power under Section 482 CrPC since instead of determining whether on a perusal of the complaint, a prima facie case is made out, it has analysed the sufficiency of the evidence with reference to the suicide note and has commented upon and made strong observations on the suicide note itself.

30. Paras 32, 33, 34 and 39 of the order [L. Bheema Naik v. State of Karnataka, 2020 SCC OnLine Kar 3395] of the High Court are extracted below : (L. Bheema Naik case [L. Bheema Naik v. State of Karnataka, 2020 SCC OnLine Kar 3395] , SCC OnLine Kar)
"32. In Para 21 [of the suicide/death note] [Ed. : As per para 31 of the impugned judgment of the High Court in L. Bheema Naik case, it is recorded as follows: "... The deceased has written a detailed death note consisting of 21 numbered and one unnumbered paragraphs. Out of 22 paragraphs, 20 paragraphs pertain to alleged dealings and the only probable portion of the death note, which could be relied upon to establish the culpability of the petitioner are Para 21...."] , a bald statement is made stating that because he is aware of all the above transaction, he was given a death threat. In the next sentence, he states that he has been psychologically/emotionally in trouble and hence, he is consuming poison and that the petitioner and his driver alone are responsible. For a person, who has detailed 20 transactions, it can be prudently expected of such a person to give details of the threat.

33. In the next unnumbered paragraph, a totally different story/note is set out as a reason for the petitioner threatening the deceased. In the unnumbered paragraph, he states that there was shortage in the cash to the tune of Rs 8 lakhs and that the petitioner suspected him as being responsible for the same and hence, threatened him that if the deceased did not repay said Rs 8 lakhs, he would have the deceased killed at the hands of rowdies. Thereafter, in the next sentence he states that in view of the same, he has decided to consume poison and that the petitioner and his driver are responsible for the same.

 34. In Para 20 [of the suicide/death note], the deceased holds the petitioner responsible for withholding the salary for the last three months. The other paragraphs including Para 20 [of the suicide/death note] detail the properties said to have been amassed by the petitioner and other illegal transactions. After having perused and scrutinised the death note, a query was put to the learned High Court Government Pleader and the counsel appearing on behalf of 2nd respondent as to whether the investigation has thrown up any material that corroborates any of the allegations set out in the death note. The learned High Court Government Pleader would fairly submit that they have not been able unearth any material to corroborate any of the allegations.
                                                          ***
 39. As discussed above, the death note contains no incriminating statement or material except for a bald and vague statement but that the accused had threatened him. Even the complaint does not disclose any details of the alleged threat nor does the complaint state that the deceased had on multiple occasions complained of having received threats from accused. Even the allegation of the demand for repayment of Rs 8 lakhs rings hollow as neither the prosecution nor the de facto complainant have been able to place an iota of material that the deceased was or had in fact been in possession of huge sum of money.”
Further, the observation of the High Court that there is no material to corroborate the allegations made in the suicide note is erroneous since it is not a consideration for the High Court while exercising its power under Section 482 CrPC, particularly in view of the fact that the trial has not begun and the Single Judge had stayed the investigation in the criminal complaint.

31. The Single Judge, other than deciding on the merits of the case while exercising the power under Section 482 CrPC, has also made observations diminishing the importance of mental health. The mental health of a person cannot be compressed into a one-size-fits-all approach. In para 37 of the impugned judgment [L. Bheema Naik v. State of Karnataka, 2020 SCC OnLine Kar 3395], the Single Judge observed: (L. Bheema Naik case [L. Bheema Naik v. State of Karnataka, 2020 SCC OnLine Kar 3395], SCC OnLine Kar)

“37. It is not the case of the deceased that the accused had deprived him of his wealth or have committed acts that have shattered his hopes in life or separated him from his family and friends.”

The Single Judge then makes the following observation in paras 41 and 43: (L. Bheema Naik case [L. Bheema Naik v. State of Karnataka, 2020 SCC OnLine Kar 3395], SCC OnLine Kar)

“41. ... It is not the case of the prosecution that the deceased was running away from or escaping the petitioner or his henchmen, but as is his habit, to visit his parents and to spend time with his friends. If the deceased had really felt threatened, he would have definitely approached the police. It is not that he was naive or not worldly-wise. If his employment with the petitioner was true, then the Police Commissionerate was only a stone's throw away. It is not that the deceased was a weakling. The deceased by profession, is a driver. A profession where, accidents causing loss of life and limb are a daily occurrence and every driver is aware that he could be involved in an accident at any time.

***

43. His act of attending a relatives marriage in a different town and his interacting with friends and relatives are all actions of a normal person and not of a person under severe duress. The contention that this criminal case would jeopardise his career progression also cannot be brushed aside. It is also not forthcoming as to how he sourced the poison.”
32. The Single Judge has termed a person who decided to commit suicide a "weakling" and has also made observations on

how the behaviour of the deceased before he committed suicide was not that of a person who is depressed and suffering from mental health issues. Behavioural scientists have initiated the discourse on the heterogeneity of every individual and have challenged the traditional notion of "all humans behave alike". Individual personality differences manifest as a variation in the behaviour of people. Therefore, how an individual copes up with a threat—both physical and emotional, expressing (or refraining to express) love, loss, sorrow and happiness, varies greatly in view of the multi-faceted nature of the human mind and emotions. Thus, the observations describing the manner in which a depressed person ought to have behaved deeply diminishes the gravity of mental health issues.

33. The High Court by its order [L. Bheema Naik v. State of Karnataka, 2020 SCC OnLine Kar 3395] has prevented the completion of the investigation in the complaint registered as Crime No. 565 of 2016 pending on the file of the IInd Additional Civil Judge (Junior Division) and JMFC Court, Maddur, Mandya District. The alleged suicide is of a person who was working as a driver of a Special Land Acquisition Officer, who is a public servant and against whom serious and grave allegations of amassing wealth disproportionate to the known sources of income were made by the deceased. The suicide note contains a detailed account of the role of the accused in the events which led to the deceased committing suicide. These are matters of investigation and possibly trial. The High Court stalled the investigation by granting an interim order of stay. If the investigation had been allowed to proceed, there would have been a revelation of material facts which would aid in the trial, for the alleged offence against the second respondent."

                                                                            (Emphasis supplied)

The Apex Court holds that in cases concerning abetment to suicide particularly of the person suffering from mental health issues should not be analyzed and assessed by the High Court in exercise of its jurisdiction under Section 482 of the CrPC. A learned Judge of this Court had held that a victim was on a weekly and was suffering from depression and mental health issues. This description of this Court to quash the proceedings did not auger well with the Apex Court. It sets aside the order passed by this Court and permitted investigation to be carried out. It is these two judgments of the Apex Court that would become applicable to the facts of the case at hand. Therefore, this Court is of the considered view that there is no warrant of interference insofar as the offence under Section 306 of the IPC is concerned.

12. The other offence that remains is under Section 498A of the IPC. The reasons so rendered supra to affirm the offence of Section 306 of the IPC would become applicable to the offence under Section 498A of the IPC as well, as the allegation is cruelty meted out against the wife by the husband. Whether it is for demand of dowry or otherwise is a matter that has to be tried while trying the offence under Section 306 of the IPC. In the case of ACHIN GUPTA supra there was only a bald allegation of torture, abuse and beating after consumption of alcohol. The Apex Court holds that they were unsubstantiated, vague and bald allegations. If allegations had remained allegations in the case at hand, this Court would have undoubtedly come to the aid of the petitioner following the judgment of the Apex Court in the case of ACHIN GUPTA. The allegations have not remained as allegations. The wife has committed suicide. Therefore, the gravity of the allegations both under Sections 498A and 306 of the IPC get so much blown that the petitioner should come out clean in a full blown trial. Finding no merit in any of the submissions made by the learned senior counsel for the petitioner, there is no warrant of interference with the pending proceedings before the concerned Court.

13. In the result, I proceed to pass the following:

ORDER
(i) The petition lacking in merit stands rejected.

(ii) It is made clear that the observations made in the course of the order are only for the purpose of consideration of the case of petitioner under Section 482 of the Cr.P.C. and the same shall not bind or influence the proceedings pending against him before the concerned Court.

Consequently, I.A.No.1 of 2023 also stands disposed.` },

ORAL ORDER
The order passed by the learned Magistrate referring the private complaint filed by respondent No.2 to the police for investigation under Section 156 (3) of Cr.P.C. and subsequent registration of FIR is questioned in this petition, on the ground that the dictum of the Hon’ble Apex Court, in the case of Priyanka Srivastava and another vs. State of Uttar Pradesh and others, reported in (2015) 6 SCC 287, has not been followed.

02. In the complaint it is alleged that two cheques which were issued by the complainant towards security, were misused by the petitioners by filing a false case against them alleging offence punishable under Section 138 of N.I. Act etc., The complaint alleging offences punishable under Sections 420, 504 and 506 read with Section 34 of IPC, was referred to police for investigation under Section 156 (3) of Cr.P.C. by the learned Magistrate vide order dated 09.03.2023, consequent to which FIR in Crime No.268/2023 was registered at Shahapur Police Station.

03. The Hon'ble Apex Court in the above referred decision at Paras No.29 to 31 has held as under:-

"29. At this stage it is seemly to state that power under Section 156 (3) warrants application of judicial mind. A Court of law is involved. It is not the police taking steps at the stage of Section 154 of the Code. A litigant at his own whim cannot invoke the authority of the Magistrate. A principled and really grieved citizen with clean hands must have free access to invoke the said power. It protects the citizens but when pervert litigations takes this route to harass their fellow citizens, efforts are to be made to scuttle and curb the same.

30. In our considered opinion, a stage has come in this country where Section 156 (3) Cr.P.C. applications are to be supported by an affidavit duly sworn by the applicant who seeks the invocation of the jurisdiction of the Magistrate. That apart, in an appropriate case, the learned Magistrate would be well advised to verify the truth and also can verify the veracity of the allegations. This affidavit can make the applicant more responsible. We are compelled to say so as such kind of applications are being filed in a routine manner without taking any responsibility whatsoever only to harass certain persons. That apart, it becomes more disturbing and alarming when one tries to pick up people who are passing orders under a statutory provision which can be challenged under the framework of the said Act or under Article 226 of the Constitution of India. But it cannot be done to take undue advantage in a criminal court as if somebody is determined to settle the scores.

31. We have already indicated that there has to be prior applications under Sections 154 (1) and 154 (3) while filing a petition under Section 156 (3). Both the aspects should be clearly spelt out in the application and necessary documents to that effect shall be filed. The warrant for giving a direction that an application under Section 156 (3) be supported by an affidavit is so that the person making the application should be conscious and also endeavour to see that no false affidavit is made. It is because once an affidavit is found to be false, he will be liable for prosecution in accordance with law. This will deter him to casually invoke the authority of the Magistrate under Section 156 (3). That apart we have already stated that the veracity of the same can also be verified by the learned Magistrate, regard being had to the nature of allegations of the case. We are compelled to say so as a number of cases pertaining to fiscal sphere, matrimonial dispute / family disputes, commercial offences, medical negligence cases, corruption cases and the cases where there is abnormal delay / laches in initiating criminal prosecution, as are illustrated in Lalita Kumari are being filed. That apart the learned Magistrate would also be aware of the delay in lodging of the FIR."

04. In the case on hand, the impugned order passed by the learned Magistrate shows that a submission was made by the learned counsel for complainant stating that police have not registered the case and in spite of submitting a complaint to the higher authorities, no case was registered. The learned Magistrate has then proceeded to refer the matter for investigation under Section 156 (3) of Cr. P.C.

05. Learned counsel for respondent No.2 has contended that the postal receipt for having sent the complaint to higher authorities was in fact submitted along with the complaint, however, he admitted that there was no sworn affidavit filed by the complainant in support of the complaint, as held in the case of Priyanka Srivastava’s case.

06. While referring to Priyanka Srivastava’s case, the Hon’ble Apex Court in another decision reported in (2022) 5 SCC 639 in the case of Babu Venkatesh and others vs. State of Karnataka and another, has reiterated the position of law, emphasizing the necessity to file an affidavit, so that the persons making application should be conscious and not make false affidavit, as if the affidavit is found to be false, the person would liable for prosecution in accordance with law.

07. In the light of the above decisions, the impugned order dated 09.03.2023 passed by the Court of Prl. Civil Judge and JMFC, Shahapur in PCR.No.52/2023 and subsequent registration of FIR in Crime No.268/2023 at Shahapur Police Station, are set-aside.

08. The complainant is at liberty to file a fresh complaint in accordance with law.` },

*******

CAV JUDGMENT

This appeal is filed by defendant No.3 in OS No.5761 of 2004 being aggrieved by the judgment and decree dated 22nd November 2008 passed by the learned XXXVIII Additional City Civil and Sessions Judge, Bangalore City.

2. The parties would be referred to as per their ranks before the trial Court for the sake of convenience.

3. The facts of the case as averred in the plaint are that, plaintiff Nos.1 to 5 before the trial Court who are respondent Nos.1 to 5 herein, claimed the relief of partition and the separate possession of their 1/9th share in the suit schedule properties and for other reliefs which are as below:

a) for revocation of Partition Deed dated 20.06.2003.
b) for partition of the suit schedule property by metes and bounds and to deliver their 1/9th share in the suit schedule property.
c) for separate possession of the plaintiff’s share in the suit schedule property.
d) and grant of permanent injunction, restraining the defendants from alienating or dispossessing the suit schedule property.
e) for grant of such other relief or reliefs, as this Hon'ble court deems fit to grant under the circumstances of the case, in the interest of justice and equity.
4. Initially, plaintiff Nos.1 and 2 had filed the suit and later, their sisters who were arrayed as defendant Nos. 5 to 7, got transposed themselves as plaintiff Nos. 3 to 5. It is the case of the plaintiffs that they are the daughters of defendant No.1 and their deceased father Govindareddy. It is stated that defendant Nos.1, 2, 3, husband of defendant No.4, defendant No.12 and another deceased Suresh Reddy were their brothers; mother of defendant No.8 to 10 Yashodamma, was another sister of the plaintiff. The family pedigree under Govindareddy is depicted as below:


5. It is relevant to note that initially, the suit was filed against defendant Nos.1 to 12 and later defendant Nos.5 to 7 were transposed as the plaintiffs. Defendant Nos. 13 to 22 were impleaded before the trial Court since they were the purchasers of the properties from the brothers of the plaintiffs. The plaintiffs, contended that their father, late Govindareddy, was allotted the land bearing Sy.No.9/2 measuring 02 acres 27 guntas, situated at Doddanekkundi village, in a partition among his brothers; during his lifetime 10 guntas of land in Sy.No.9/2 was acquired by the Railways; and after the death of Govindareddy, the plaintiffs and defendant Nos. 1 to 12 had succeeded to the property. After death of Govindareddy, defendant No.1 Muniyamma got transferred the Katha (revenue entry) in respect of the said Sy.No.9/2 in her name. Later, 28 guntas of land in the said land was acquired by the Government for formation of the ring road. Therefore, only 01 acre, 27 guntas of land was available to them, as described at item No.1 in the schedule to the plaint. It is also the case of the plaintiffs that the defendant Nos.1 to 4 have received a compensation amount of Rs.4,20,826/- which was awarded for the acquisition of 28 guntas by the Government and the plaintiffs are also entitled for share in the same. It is contended that defendant Nos.1 to 7 colluding with each other have entered into a partition in the suit schedule properties among themselves under a registered partition deed dated 20-06-2003. In the said partition, the plaintiffs were excluded and therefore, the said partition is not binding on them.

6. Later, when defendant Nos.5 to 7 were transposed as plaintiffs, it appears that they have also acceded to the said contention. Further, it is the case of the plaintiffs that after effecting the partition in the suit schedule properties, defendant Nos.1 to 4 have formed revenue sites in portions allotted to their share and sold the same to different people. Though the defendants were requested to effect partition and give share to plaintiffs, they failed and therefore, the plaintiffs are entitled for partition and legitimate share. Inter alia, the plaintiffs also contended that the suit schedule properties are the ancestral properties of Govindareddy, who is none other than the father of the plaintiffs and therefore, they being the members of the Hindu undivided family, they are entitled for partition.

7. On issuance of summons, except defendant Nos. 18 and 22, all other defendants appeared before the trial Court.

8. Defendant No.4 died, and his legal heirs were brought on record before the trial Court. In the meantime, defendant No.1 Muniyamma also died and her name was deleted from the cause title.

9. Defendant Nos. 1 to 3 together filed the written statement and admitted the case of the plaintiffs that their father Govindareddy got item No.1 of the suit schedule property in a partition amongst his brothers dated 08-06-1972. They also admitted the relationship between the parties. They admitted that 28 guntas in Sy.No.9/2, was acquired by the Government for the formation of the ring road but contended that compensation was awarded, and such compensation was received by defendant No.1 Muniyamma and she had spent the same for the benefit of the family. They contended that item Nos.3 and 4 of the suit schedule properties are not the joint family properties and they were belonging exclusively to Govindareddy. Defendant Nos.2 and 3 also contended that since the marriages of the plaintiffs were performed prior to coming into force of the Hindu Succession (Karnataka Amendment) Act, 1990, the plaintiffs are not entitled for a share in the suit schedule properties. However, they admitted that there was a partition on 20-06-2003.

10. Defendant No.4 in his written statement has taken up similar contentions and further contented that he is an illiterate and innocent person and taking undue advantage of the same, defendant Nos.2,3,6 and 12 have got his signature on the document and he was not given proper share in item No.1 of the suit schedule property.

11. Defendant Nos. 8 to 11 in their written statement have admitted the case of the plaintiffs and they further contended that the their mother Yashodamma, who was the daughter of Govindareddy, is also entitled for equal share in the suit schedule properties and they sought for a decree in their favor.

12. Defendant No.12 in his written statement contended that the suit schedule properties belonged to their father Govindareddy, and they are his self-acquired properties. It was contended that after death of Govindareddy, defendant Nos.1 to 4 had entered into a partition in which they have divided item No.1 of the suit schedule property and defendant Nos.1 to 4 did not include item No.3 and 4 properties in the partition dated 20.06.2003 and they refused to give their share to the daughters of Govindareddy and as such he had opposed the partition. He has taken up similar contention as that of the defendant No.4. He was also categorical in saying that the partition dated 20-06-2003, executed by him and defendant Nos.1 to 4 is not valid and the same is liable to be cancelled and that he is entitled for a share.

13. Defendant Nos.13 to 16 and 19 to 21 in their written statements have contended that the marriages of the plaintiffs were performed earlier to the amended provisions of the Hindu Succession Act came into force and defendant Nos.1 to 7 had effected the partition in the suit schedule properties under the registered partition deed dated 20-06-2003 and therefore, they being the bona fide purchasers of portions of the suit schedule properties, and the inter-se dispute is not binding on them. They further contended that, if at all, there is any partition to be ordered, then the properties purchased by them must be allotted to their respective vendors in an equitable partition.

14. Based on the above pleadings, the following issues were framed by the trial Court:

1) Whether plaintiffs prove that suit schedule properties are the ancestral and joint family properties consisting of themselves and defendants No.1 to 7 and 12?
2) Whether plaintiffs prove that they are entitled to a share in the suit properties and if so in which of the suit properties and to what share?
3) Whether plaintiffs prove that the registered partition deed dated 20.06.2003 executed by defendants No.1 to 4 and 12 and plaintiff No.4 is null and void and not binding on them?
4) Whether defendant No.12 proves that defendants No.1 to 4 has taken his signature on registered partition deed dated 20.06.2003 by force, and hence the same is not binding on him?
5) Whether defendants No.2 and 3 prove that defendant No.1 deceased Smt. Muniyamma had received the entire compensation amount of Rs.4,30,826/- from Government and she had spent the said amount for discharging antecedent debts of the family and for the benefits of plaintiffs?
6) Whether the Court fee paid by plaintiffs is proper and sufficient?
7) Whether Court fee paid by defendant No.12 on the reliefs claimed by him in his written statement is proper and sufficient?
8) Whether defendants No.13 to 21 prove that they are the bonafide purchasers of portions of item No.1 of suit schedule property for valuable consideration?
9) To what reliefs parties are entitled to?
10) What order or decree?

s are entitled for 1/11th of 1/6th share in the suit schedule properties. It is submitted that defendant Nos.2,3, 4 and 12 would be entitled for 1/6th share in their individual capacity as coparceners under Section 6 of the Hindu Succession Act and 1/66th share in the estate of Govindareddy under Section 8 of the Hindu Succession Act. Therefore, the trial Court has erred in calculating the shares also.

22. In this regard, the learned counsel appearing for the appellant has placed reliance on the judgments in the case of

2. Vellikannu Vs. R. Singaperumal and another [(2005) 6 SCC 622];

1. Commissioner of Wealth Tax, Kanpur and others Vs. Chander Sen and others [(1986) 3 SCC 567];
