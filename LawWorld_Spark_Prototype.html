4. Bhimsi Fakirappa, Bijjur dead by his LRs and others Vs. Nagesh Bhimppa Waddar and others [RFA No.23/2002 C.W. RFA No.1012/2001 DD 22.12.2022] rendered by a Division Bench of this Court.
26. In the light of the above contentions urged by both the parties, the questions that need to be decided are:

1. Whether the trial Court erred in holding that the plaintiffs are entitled for 1/10th share each in the suit schedule properties by holding that the suit schedule properties are to devolve u/s 8 of the Hindu Succession Act?

2. Whether the judgment of the trial Court holding that the partition dated 20-06-2003 is liable to be cancelled is proper, and correct?

Re.Point No.1:

27. The learned counsel appearing for appellant argued that the trial Court erred in holding that the suit schedule properties would devolve upon the legal heirs of deceased Govindareddy under Section 8 of the Hindu Succession Act. It is his contention that there was a partition in the year 2003 among the legal heirs of Govindareddy and therefore, the said partition is saved under the provisions of Section 6(5) of the Hindu Succession Act as it stood amended in the year 2005. On that ground, he submits that nature of the suit schedule property was amenable for partition as per the Hindu Succession Act as it stood prior to the amendment.

28. To fortify his argument, he submits that traditionally, a joint family comprises of male members who are the lineal decedents from common male ancestor together with their mother, wife and unmarried daughters. A Hindu coparcenary comprises of the propositus and the three lineal male decedents. Before 2005, a coparcenary included only the sons, grandsons and great-grandsons and therefore, the coparcenary is the custodian of the ancestral property. He submits that when the share is allotted in partition, whether the same would constitute a separate property in the hands of the person to whom it is allotted and whether sons, his lineal decedents can make a claim in relation to such property allotted in the partition is no more res-integra. He submits that the property being ancestral, will not loose the character of coparcenary property qua the sons of Govindareddy.

29. It is pertinent to note that in the case on hand, the evidence on record shows that item No.1 i.e., 'Sy.No.9/2' and the house property at item No.3 which is described as "All that house property bearing No.158 measuring East to West 48 feet and North to South 44 feet situated in Dodddanekundi Village, Bangalore," was part of the Partition Deed of the year 1972 between Govindareddy and his brothers. The said Partition Deed is at Ex.P6 and it discloses that two other brothers of Govindareddy had separated much earlier and therefore, the partition was between Govindareddy and his brother Gurumurthy. In the said partition, the suit schedule property bearing Sy.No.9/2 and one of the house properties was allotted to Govindareddy. Though the document is not clear as to how the Sy.No.9/2 had come to them; it is not in dispute that the suit schedule property is ancestral property, and it devolved upon the said Govindareddy and Gurumurthy from their father Nanjareddy. The other brothers of Govindareddy and Gurumurthy i.e., Narayanareddy, Gurushamareddy and Krishnareddy have already separated as mentioned in Ex.P6. Therefore, it can safely be held that Govindareddy and Gurumurthy were the co-parceners, who remained joint till the partition in the year 1972 as per Ex. P6.

30. When the partition took place in the year 1972 as per Ex.D12, Sy.No.9/2 and the house property at item No.3 came to the share of Govindareddy. The question is, whether this devolution of the property in favour of Govindareddy under Ex.D12 (also at Ex.P20) would result in the property being self acquired property of Govindareddy or whether it would remain to be ancestral property in the hands of Govindareddy and his sons?

31. The trial Court has concluded that it attains the character of individual property of Govindareddy, by virtue of Partition Deed dated 1972. In the impugned judgment, in para 31 and 32, the trial Court observes as below:

"31. From the laws laid down by their Lordships in the above said decisions, it is clear that the property inherited by a son from his father will be his individual property. He inherits the same as an individual and not as Kartha of his own family. Hence, the said property is not the coparcenery property of his sons and his sons will not acquire any right over the said property by birth. Hence, the properties which late Sri. Govinda Reddy and his brother Gurumurthy had inherited from their father, and in which they had effected partition under the partition deed dated 08.06.1972, are their individual properties and they will not become coparcenery properties of their sons i.e., defendant Nos.2 to 4 and 12. Though plaintiffs and defendant Nos. 1 to 4 and 8 to 12 have inherited the suit schedule properties from their ancestors, but, they are not the co-parcenery properties of defendant Nos. 2 to 4 and 12. The laws laid down by their Lordships in the decisions on which the learned Counsel for defendants relied are not aptly applicable to the facts of the present case. Under the circumstances and for the reasons discussed above, I hold that plaintiffs have proved that suit schedule properties (item Nos. 1, 3 and 4) are the ancestral and joint family properties consisting of themselves and defendant Nos. 1 to 4 and 12."

32. As I have already stated above, the suit properties are individual or separate properties of late Sri Govinda Reddy and they are not co-parcenery properties of defendant Nos. 2 to 4 and 12. Hence, after the death of late Sri Govinda Reddy, plaintiffs, defendant Nos. 1 to 4, mother of defendant Nos. 8 to 11 late Smt. Yeshodamma and defendant No.12, being his Class I heirs, have succeeded to the suit properties (item Nos. 1, 3 and 4), and each of them are entitled for 1/11th share."

(emphasis supplied)

32. The said finding is assailed by the appellant herein who is defendant No.3 before the trial Court. The Shastric Hindu Law, prior to codification in the form of Hindu Succession Act, 1956, or its earlier avatars, recognized the Hindu coparcenary as the sole entity that would hold the title to the family property. The Law of Succession among Hindus flowed from the responsibility of the sons to perform the rituals for the Moksha of their ancestors, from the income generated from property. The successive enactments recognized the rights of women/daughters and right to property. Therefore, the enactments show the conceptual shift from the spiritual acts and obligations of sons towards property oriented, possessive, ownership-based rights and liabilities. Now,
the question before this Court is whether the concept of coparcenary has died, extinguished by virtue of Section 8 of the Hindu Succession Act or whether it exists with certain conditions for succession?

33. In the case of Valliammai Achi Vs. Nagappa Chettiar and another which is relied by the learned counsel for the appellant as referred supra, the Apex Court while dealing with the rights of father, who had inherited a property from his ancestors in willing away part of it to one of his son, in paras 10 and 11 observed as below:

“10. ............ A father cannot turn joint family property into absolute property of his son by merely making a will, thus depriving sons of the son who might be born thereafter of their right in the joint family property. It is well settled that the share which a co-sharer obtains on partition of ancestral property is ancestral property as regards his male issues. They take an interest in it by birth whether they are in existence at the time of partition or are born subsequently: [see Hindu Law by Mulla, 13th Edn., p. 249, para 223(2)(4)]. If that is so and the character of the ancestral property does not change so far as sons are concerned even after partition, we fail to see how that character can change merely because the father makes a will by which he gives the residue of the joint family property (after making certain bequests) to the son. xxxxxx

11. Further it is equally well settled that “under the Mitakshara law each son upon his birth takes an interest equal to that of his father in ancestral property, whether it be movable or immovable. It is very important to note that the right which the son takes at his birth in the ancestral property is wholly independent of his father. He does not claim though the father....” (see Mulla's Hindu Law, 13Th Edn., p. 251, para 224). It follows therefore that the character of the property did not change in this case because of the will of Pallaniappa's father and it would still be joint family property in the hands of Pallaniappa so far as his male issue was concerned. .......”

(emphasis supplied)

34. In the case of Vellikannu Vs. R. Singaperumal and another referred supra, the Apex Court in Para 11 noticed the accepted views of all Authors and referred to paras 284 and 285 of Hindu Law by Mulla, 15th Edition (1982) and in para 13, it was noted that, the right of the coparceners would be by birth. In para 15, the law laid down in several other judgments were also noticed. In para 11, it was observed as below:

“11. .......... So far as the rights of coparceners in the Mitakshara law are concerned, the son acquires by birth or adoption a vested interest in all coparcenary property whether ancestral or not and whether acquired before or after his birth or adoption, as the case may be, as a member of a joint family. This is the view which has been accepted by all the authors of the Hindu law. In the famous principles of Mulla, 15th Edn. (1982) at pp. 284 and 285, the learned author has stated thus:

"The essence of a coparcenary under the Mitakshara law is unity of ownership. The ownership of the coparcenary property is in the whole body of coparceners. According to the true notion of an undivided family governed by the Mitakshara law, no individual member of that family, whilst it remains undivided, can predicate, of the joint and undivided property, that he, that particular member, has a definite share, one-third or one-fourth. His interest is a fluctuating interest, capable of being enlarged by deaths in the family, and liable to be diminished by births in the family. It is only on a partition that he becomes entitled to a definite share. The most appropriate term to describe the interest of a coparcener in coparcenary property is 'undivided coparcenary interest'. The nature and extent of that interest is defined in Section 235. The rights of each coparcener until a partition takes place consist in a common possession and common enjoyment of the coparcenary property. As observed by the Privy Council in Katama Natchiar v. Rajah of Shivagunga [(1863) 9 MIA 543], 'there is community of interest and unity of possession between all the members of the family, and upon the death of any one of them the others may well take by survivorship that in which they had during the deceased's lifetime a common interest and a common possession'."

By referring to Hindu Law by S.V. Gupte, Vol.1, 3rd Edition (1981) at P.162, it was observed that,

".....till partition, the coparcener is entitled to joint possession and enjoyment of the joint family property and right to claim joint family property by survivorship and the right to demand partition of the joint family property."

Then in para 13, by referring to Hindu Law by N.R. Raghavachariar, it observes while dealing with right by birth that, "every coparcener gets an interest by birth in the coparcenary property and this right by birth relates back to the date of conception".

35. In the case of Shyam Narayan Prasad Vs. Krishna Prasad and others referred supra, in para 12 and 13, it was observed as below:

"12. It is settled that the property inherited by a male Hindu from his father, father's father or father's father'sfather is an ancestral property. The essential feature of ancestral property, according to Mitakshara Law, is thatthe sons, grandsons, and great grandsons of the person who inherits it, acquire an interest and the rightsattached to such property at the moment of their birth. The share which a coparcener obtains on partition ofancestral property is ancestral property as regards his male issue. After partition, the property in the hands ofthe son will continue to be the ancestral property and the natural or adopted son of that son will take interestin it and is entitled to it by survivorship.

13. In C. Krishna Prasad v. CIT [(1975) 1 SCC 160] , this Court was considering a similar question. In thesaid case, C. Krishna Prasad, the appellant along with his father Krishnaswami Naidu and brother C. Krishna Kumar formed Hindu Undivided Family up to 30-10-1958, when there was a partition between Krishnaswami Naidu and his two sons. A question arose as to whether an unmarried male Hindu on partition of a joint Hindu family can be assessed in the status of undivided family even though no other person besides him is a member of the family. It was held that the share which a coparcener obtains on partition is ancestral property as regards male issue. It was held as under:

"The share which a coparcener obtains on partition of ancestral property is ancestral property as regards his male issue. They take an interest in it by birth, whether they are in existence at the time of partition or are born subsequently. Such share, however, is ancestral property only as regards his male issue. As regards other relations, it is separate property, and if the coparcener dies without leaving male issue, it passes to his heirs by succession (see p. 272 of Mulla's Principles of Hindu Law, 14th Edn.). A person who for the time being is the sole surviving coparcener is entitled to dispose of the coparcenary property as if it were his separate property. He may sell or mortgage the property without legal necessity or he may make a gift of it. If a son is subsequently born to him or adopted by him, the alienation, whether it is by way of sale, mortgage or gift, will nevertheless stand, for a son cannot object to alienations made by his father before he was born or begotten."

(emphasis supplied)

36. The Apex Court in the case of Arshnoor Singh Vs. Harpal Kaur and others referred supra, distinguishing the judgment in the case of Yudhis hter Vs. Ashok Kumar [(1987) 1 SCC 204)] has relied on the judgment in the case of Valliammai Achi (referred supra) and in that case held that the property which came to the share Dharam Singh through partition under a Court decree, among his brothers, remained coparcenary property qua his son, who had become a coparcener in the suit property on his birth in the year 1985.

37. In the recent judgment in the case of Derha Vs. Vishal and another, referred supra, the Apex Court had an occasion to consider the nature of the properties acquired by one Phannuram in a partition among his nephew in 1964. The fact that there was partition between Phannuram and his brother's son Ramnath and sister-in- law was not in dispute. It was held in paras 9 as below:

"9. Once it is held that the properties which were the subject matter of the partition suit were coparcenary properties, the only issue that remains is as to how the said properties were to be divided amongst the legal heirs of Phannuram upon his death in 1959, i.e., after the advent of the Hindu Succession Act, 1956 (for brevity, 'the Act of 1956'). Section 6 of the Act of 1956 would govern the situation, as rightly observed by the Chhattisgarh High Court. Section 6 of the Act of 1956, as it then stood, states that when a male Hindu died after the commencement of the Act of 1956, having at the time of his death an interest in Mitakshara coparcenary property, his interest in that property shall devolve by survivorship upon the surviving members of the coparcenary. However, the proviso thereto states that, if the deceased left behind him a surviving female relative specified in Class I of the Schedule or a male relative specified in that class who claimed through such female relative, the interest of the deceased in the Mitakshara coparcenary property shall devolve by testamentary or intestate succession, as the case may be, under the Act of 1956 and not by survivorship. Explanation 1 clarified that, for the purposes of Section 6, the interest of a Hindu Mitakshara coparcener shall be deemed to be the share in the property that would have been allotted to him if a partition of the property had taken place immediately before his death, irrespective of whether he was entitled to claim such partition or not."

By observing as above, it was held that Phannuram and his son Vishal would get 1/2 share each and in the half share of Phannuram, his wife and all children would get equal share. The Apex Court in coming to such conclusion has also placed reliance on the judgment in the case of Gurupad Khandappa Magdum Vs. Hirabai Khandappa Magdum and others referred supra and has followed the ratio laid down therein.

38. From the above observations by the Apex Court, it is clear that whenever there is a partition among the brothers in respect of the ancestral property held by them, the property would not change its nature but it remains as the ancestral property of smaller coparcenery of himself and his male children. Even if a son is born subsequent to such partition of the ancestral property, then he would get rights by birth. The entitlement for a share in the ancestral property cannot be denied.

39. It is worth to note that the observations of the Apex Court in the decisions mentioned above, are flowing from the propositions laid down in the treatises on Hindu Law. In Article 221 of Hindu Law by Mulla, 21st Edition, Page 335 concerning the 'ancestral property', the Author has observed as below:

"221. Ancestral Property - (1) ...... Thus, if A inherits property, whether movable or immovable, from his father or father's father, or father's father's father, it is ancestral property, as regards his male issue. If A has no son, son's son, or son's son's son in existence at the time when he inherits the property, he holds the property as absolute owner thereof, and he can deal with it as he pleases. However, if he has son's son' sons or sons' sons' sons in existence at the time, or if a son, son's son or son's son's son is born to him subsequently, they become entitled to an interest in it by the mere fact of their birth in the family, and A cannot claim to hold the property as absolute owner nor can he deal with the property as he likes. The position has been materially affected after s 8 of the Hindu Succession Act, 1956, came into force.

A father cannot change the character of the joint family property into absolute property of his son by merely marking a will and bequeathing it or part of it to the son as if it was the self-acquired property of the father......

(2) xxxxxx

(3) Property inherited from collaterals - property inherited from females - Excluding the case of property inherited from a maternal grandfather, it may be said that the only property that can be called ancestral property is property inherited by a person from his father, father's father or father's father's father. Property inherited by a person from any other relation is his separate property, and his male issues do not take any interest in it by birth. Thus, property inherited by a person from collaterals, such as a brother, uncle, etc, or property inherited by him from a female, eg., his mother, is his separate property.

(4) Share allotted on partition. - The share, which a coparcener obtains on partition of ancestral property, is ancestral property as regards his male issue. They take an interest in it by birth, whether they are in existence at the time of partition or are born subsequently. Such share, however, is ancestral property only as regards his male issue. As regards other relations, it is separate, and if the coparcener dies without leaving a male issue, it passes to his heirs by succession. Reference may also be made to notes under 8 of the Hindu Succession Act, 1956 and the Supreme court and High Court decisions as to ancestral property cited there."

(emphasis supplied)

The learned Author also observes that, in the recent judgment by Punjab and Haryana High Court, the propositions laid down in Article 321 and 322 of the treatise were incorrectly interpreted.

40. Further, in the treatises on Mayne’s Hindu Law and Usage, 15th, Edition, in para 295, it is observed as below:

"295. Where ancestral property has been divided between several joint owners, there can be no doubt that if any of them have male issue living at the time of the partition, the share which falls to him will continue to be ancestral property in his hands, as regards has male issue, for their rights had already attached upon it, and the partition only cuts off the claims of the dividing members. The father and his male issue still remain joint. The same rule would apply even where the partition had been made before the birth of male issue or before a son is adopted, for the share which is taken at a partition, by one of the coparceners is taken by him as representing his branch. It was held by the Andhra Pradesh High Court that where a father divided the family property between him and his sons, the share obtained by him was his self- acquired property which he could bequeath to his wife......"

(emphasis supplied)

41. The learned counsel appearing for the respondents contends that the provisions of Section 6 of the Hindu Succession Act, as it stood prior to the amendment is applicable, since there is a partition by a registered deed as per Ex. P20 (Ex.D12) dated 20-06-2003. Therefore, the explanation that the amended provisions will not be applicable if there is partition would aptly come in play. He submits that the Apex Court in the case of Gurupada Kandappa Magdum while giving effect to the provisions of Hindu Succession Act, 1956, has held that the interpretation of Section 6 will have to further the legislative intent regarding enlargement of the share of the female heirs. In the said judgment, it was held as below:

"6. The Hindu Succession Act came into force on June 17, 1956. Khandappa having died after the commencement of that Act, to wit in 1960, and since he had at the time of his death an interest in Mitakshara coparcenary property, the preconditions of Section 6 are satisfied, and that section is squarely attracted. By the application of the normal rule prescribed by that section, Khandappa's interest in the coparcenary property would devolve by survivorship upon the surviving members of the coparcenary and not in accordance with the provisions of the Act. But, since the widow and daughter are amongst the female relatives specified in class I of the Schedule to the Act and Khandappa died leaving behind a widow and daughters, the proviso to Section 6 comes into play and the normal rule is excluded. Khandappa's interest in the coparcenary property would therefore devolve, according to the proviso, by intestate succession under the Act and not by survivorship. Testamentary succession is out of question as the deceased had not made a testamentary disposition though, under the explanation to Section 30 of the Act, the interest of a male Hindu in Mitakshara coparcenary property is capable of being disposed of by a will or other testamentary disposition.

xxxxxxx

10. Two things are thus clear: One, that in a partition of the coparcenary property Khandappa would have obtained a 1/4th share and two, that the share of the plaintiff in the 1/4th share is 1/6th, that is to say, 1/24th. So far there is no difficulty. The question which poses a somewhat difficult problem is whether the plaintiff's share in the coparcenary property is only 1/24th or whether it is 1/4th plus 1/24th, that is to say, 7/24th. The learned trial Judges relying upon the decision in Shiramabai which was later overruled by the Bombay High Court, accepted the former contention while the High Court accepted the latter. The question is which of these two views is to be preferred.

11. We see no justification for limiting the plaintiff's share to 1/24th by ignoring the 1/4th share which she would have obtained had there been a partition during her husband's lifetime between him and his two sons. We think that in overlooking that 1/4th share, one unwittingly permits one's imagination to boggle under the oppression of the reality that there was in fact no partition between the plaintiff's husband and his sons. Whether a partition had actually taken place between the plaintiff's husband and his sons is beside the point for the purposes of Explanation 1. That Explanation compels the assumption of a fiction that in fact “a partition of the property had taken place”, the point of time of the partition being the one immediately before the death of the person in whose property the heirs claim a share.

12. ...............Lord Asquith in his famous passage in East End Dwellings Co. Ltd. v. Finsbury Borough Council [1952 AC 109, 132 : (1951) 2 All ER 587] . He said:

“If you are bidden to treat an imaginary state of affairs as real, you must also imagine as real the consequences and incidents which, if the putative state of affairs had in fact existed, must inevitably have flowed from or accompanied it; and if the statute says that you must imagine a certain state of affairs, it cannot be interpreted to mean that having done so, you must cause or permit your imagination to boggle when it comes to the inevitable corollaries of that state of affairs.”

xxxxxxxxxxx

14. The interpretation which we are placing upon the provisions of Section 6, its proviso and Explanation 1 thereto will further the legislative intent in regard to the enlargement of the share of female heirs, qualitatively and quantitatively.......”
(emphasis supplied)

42. It is pertinent to note that the Apex Court had state of affairs for the purpose of determining the share. It is equally important to note that, it never said or intended that the concept of coparcenary comes to an end. Therefore, this decision is not of any help to augment the argument of respondents.

43. He further contends that the view taken by the Apex Court in the case of C.W.T. Kanpur Vs. Chander Sen and others referred supra, in para 12, 17 and 19 is that, when a male Hindu dies after commencement of the Act, his interest in the Mitakshara coparcenary property shall devolve under Section 6 by survivorship and if he leaves behind a female heir, it shall devolve under Section 8 of the Act.

44. A Division Bench of this Court in a recent judgment in the case of Jayashree Jayanth Vs N Krishnaswamy and others [RFA No. 1226 of 2016 DD 22-10-2024] has clarified the ratio laid in Chandersen's case, wherein it is observed as below.

"24. If the facts are put to analysis, it becomes very evident that the Hindu Undivided Family consisting of Chander Sen and his father disrupted when partition took place on 10.10.1961. The partnership business that was commenced by them after the partition was not the family business. A sum of Rs.1,85,043/- belonged to Rangilal as the books of accounts showed that it was credit balance in the account of Rangilal. That means this sum exclusively belonged to Rangilal and it devolved on his son Chander Sen in accordance with section 8 of Hindu Succession Act. This sum was not part of the Joint Family property. In para 7 of the judgment it is clearly observed that the amount could not be said to belong to Joint Hindu Family and qua Chander Sen and his sons it was separate property of Rangilal. On Rangilal’s death amount passed on to his son Chander Sen by inheritance. It was in this context that the Hon’ble Supreme Court noticed the effect of section 8 making an observation that son alone would inherit the property of a male Hindu. When Rangilal died, Chander Sen had a son. The presence of Chander Sen’s son did not have the effect of succession by Chander Sen to the said sum to make it a property of joint family. If Shastric Law had been applied, because of presence of Chander Sen’s son at the time of Rangilal’s death, the money that Chander Sen inherited would have become joint family property. But by virtue of section 4 of Hindu Succession Act, it was held that section 8 would come into picture in this kind of situation and Shastric Hindu Law was not applicable. Unfortunately this position is wrongly applied to give a meaning that even devolution by survivorship of a coparcenary property is governed by section 8 which exclusively deals with inheritance of self acquired or separate property of a male Hindu. However it is true that whenever notional partition is effected to determine the share of the deceased male Hindu, since it becomes separate property of the deceased, the devolution of such interest takes place according to section 8."

45. After observing so, it also considered various judgments of the Apex Court and concluded that whenever devolution of separate or self acquired property of male Hindu takes place, Section 8 is applicable, not Section 6. But wherever Rule of Survivorship is applicable, Section 8 has no applicability. Therefore, the case of Chander Sen has no applicability to the case on hand.

46. Regarding the proposition laid down in the case of Uttam Vs. Soubhagsingh referred supra, the Division Bench observed as below:

"31. Lastly in Uttam, the principles culled out are found in para 18 and they are:

(i) When a male Hindu dies after the commencement of the Hindu Succession Act, 1956, having at the time of his death an interest in Mitakshara coparcenary property, his interest in the property will devolve by survivorship upon the surviving members of the coparcenary (vide Section 6).

(ii) To proposition (i), an exception is contained in Section 30 Explanation of the Act, making it clear that notwithstanding anything contained in the Act, the interest of a male Hindu in Mitakshara coparcenary property is property that can be disposed of by him by will or other testamentary disposition.

(iii) A second exception engrafted on proposition (i) is contained in the proviso to Section 6, which states that if such a male Hindu had died leaving behind a female relative specified in Class I of the Schedule or a male relative specified in that class who claims through such female relative surviving him, then the interest of the deceased in the coparcenary property would devolve by testamentary or intestate succession, and not by survivorship.

(iv) In order to determine the share of the Hindu male coparcener who is governed by Section 6 proviso, a partition is effected by operation of law immediately before his death. In this partition, all the coparceners and the male Hindu's widow get a share in the joint family property.

(v) On the application of Section 8 of the Act, either by reason of the death of a male Hindu leaving self-acquired property or by the application of Section 6 proviso, such property would devolve only by intestacy and not survivorship.

(vi) On a conjoint reading of Sections 4, 8 and 19 of the Act, after joint family property has been distributed in accordance with Section 8 on principles of intestacy, the joint family property ceases to be joint family property in the hands of the various persons who have succeeded to it as they hold the property as tenants-in-common and not as joint tenants."

32. The above principles make two aspects clear, firstly that devolution of Mithakshara coparcenary property takes place by survivorship, and section 8 is applicable while distributing the notional share of the deceased male Hindu. The last paragraph in Uttam shows findings on facts of that case, it is not a ratio.

33. The conclusion therefore is that even if the above three decisions had been brought to the notice of the coordinate bench, the legal position would not have changed. This observation is necessary to be made here because judgment in Pushpalatha was authored by one of us."

After saying as above, the Court gave an illustration also, to demonstrate the manner of devolution of the property.

47. It is significant to note that the exception contained in the proviso to Section 6 of the Hindu Succession Act, states that, if a male Hindu had died leaving behind female relative specified in Class I of the schedule or a male relative specified in that Class who claims through such female relative surviving him then the interest of the deceased in the coparcenary property would devolve by testamentary or intestate succession and not by survivorship. This would show that the nature of the property to be a coparcenary property would not change but it must be partitioned among the coparceners engrafting a notional share to the deceased male Hindu; and his interest in it only would devolve by intestate succession. Such intestate succession would be as per Section 8 of the Act. Therefore, at any rate, 'the interest of the deceased male Hindu in the coparcenary property' alone would be devolving as per Section 8 but not the entire property. The provisions are very clear in saying that it is only the interest in the coparcenary property but not the entire property.

48. There is one another reason to hold that the concept of coparcenary has not been abrogated or shelved. It is worth to note that by the Amending Act of 2005, the provisions of Section 6 of the Hindu Succession Act, were amended. Both versions of Section 6 read as below:

Before amendment:

"6. Devolution of interest in coparcenary property. —When a male Hindu dies after the commencement of this Act, having at the time of his death an interest in a Mitakshara coparcenary property, his interest in the property shall devolve by survivorship upon the surviving members of the coparcenary and not in accordance with this Act :

Provided that, if the deceased had left him surviving a female relative specified in Class I of the Schedule or a male relative specified in that class who claims through such female relative, the interest of the deceased in the Mitakshara coparcenary property shall devolve by testamentary or intestate succession, as the case may be, under this Act and not by survivorship.

Explanation 1.—For the purposes of this section, the interest of a Hindu Mitakshara coparcener shall be deemed to be the share in the property that would have been allotted to him if a partition of the property had taken place immediately before his death, irrespective of whether he was entitled to claim partition or not.

Explanation 2.—Nothing contained in the proviso to this section shall be construed as enabling a person who had separated himself from the coparcenary before the death of the deceased or any of his heirs to claim on intestacy a share in the interest referred to therein.

After amendment:

"6. Devolution of interest in coparcenary property. —

(1) On and from the commencement of the Hindu Succession (Amendment) Act, 2005, in a Joint Hindu family governed by the Mitakshara law, the daughter of a coparcener shall, —

(a)by birth become a coparcener in her own right in the same manner as the son;

(b)have the same rights in the coparcenary property as she would have had if she had been a son;

(c)be subject to the same liabilities in respect of the said coparcenary property as that of a son, and any reference to a Hindu Mitakshara coparcener shall be deemed to include a reference to a daughter of a coparcener:

Provided that nothing contained in this sub-section shall affect or invalidate any disposition or alienation including any partition or testamentary disposition of property which had taken place before the 20th day of December, 2004.

(2) Any property to which a female Hindu becomes entitled by virtue of sub-section (1) shall be held by her with the incidents of coparcenary ownership and shall be regarded, notwithstanding anything contained in this Act or any other law for the time being in force in, as property capable of being disposed of by her by testamentary disposition.

(3)Where a Hindu dies after the commencement of the Hindu Succession (Amendment) Act, 2005, his interest in the property of a Joint Hindu family governed by the Mitakshara law, shall devolve by testamentary or intestate succession, as the case may be, under this Act and not by survivorship, and the coparcenary property shall be deemed to have been divided as if a partition had taken place and,—

(a)the daughter is allotted the same share as is allotted to a son;

(b)the share of the pre-deceased son or a pre- deceased daughter, as they would have got had they been alive at the time of partition, shall be allotted to the surviving child of such pre- deceased son or of such pre-deceased daughter; and

(c)the share of the pre-deceased child of a pre- deceased son or of a pre-deceased daughter, as such child would have got had he or she been alive at the time of the partition, shall be allotted to the child of such pre-deceased child of the pre-deceased son or a pre-deceased daughter, as the case may be.

Explanation. —For the purposes of this sub-section, the interest of a Hindu Mitakshara coparcener shall be deemed to be the share in the property that would have been allotted to him if a partition of the property had taken place immediately before his death, irrespective of whether he was entitled to claim partition or not.

(4) After the commencement of the Hindu Succession (Amendment) Act, 2005, no court shall recognise any right to proceed against a son, grandson or great-grandson for the recovery of any debt due from his father, grandfather or great- grandfather solely on the ground of the pious obligation under the Hindu law, of such son, grandson or great-grandson to discharge any such debt:

Provided that in the case of any debt contracted before the commencement of the Hindu Succession (Amendment) Act, 2005, nothing contained in this sub-section shall affect—

(a)the right of any creditor to proceed against the son, grandson or great-grandson, as the case may be; or

(b)any alienation made in respect of or in satisfaction of, any such debt, and any such right or alienation shall be enforceable under the rule of pious obligation in the same manner and to the same extent as it would have been enforceable as if the Hindu Succession (Amendment) Act, 2005 had not been enacted.

Explanation. —For the purposes of clause (a), the expression “son”, “grandson” or “great-grandson” shall be deemed to refer to the son, grandson or great-grandson, as the case may be, who was born or adopted prior to the commencement of the Hindu Succession (Amendment) Act, 2005.
(5) Nothing contained in this section shall apply to a partition, which has been effected before the 20th day of December, 2004.

Explanation. —For the purposes of this section “partition” means any partition made by execution of a deed of partition duly registered under the Registration Act, 1908 (16 of 1908) or partition effected by a decree of a court."

Thus, it is clear that the daughter, who could not be a coparcener as per old law, is conferred with the same rights as coparcener. This would inevitably indicate that the rights in coparcenary property, which was restricted to male members only, has been enlarged to daughters also.

49. Thereafter, the Apex Court in the case of Vineeta Sharma Vs. Rakesh Sharma [(2020)9 SCC 1] has laid down the way the amended provisions of Section 6 would operate, which reads as below:

"133. The severance of status may take place from the date of filing of a suit; however, a decree is necessary for working out the results of the same, and there may be a change of rights during the pendency of the suit for allotting definite shares till final decree is passed. There are cases in which partition can be reopened on the ground of fraud or mistake, etc. or on certain other permissible grounds. In appropriate cases, it can be reopened at the instance of minor also.

xxxx

135. A special definition of partition has been carved out in the Explanation. The intendment of the provisions is not to jeopardise the interest of the daughter and to take care of sham or frivolous transaction set up in defence unjustly to deprive the daughter of her right as coparcener and prevent nullifying the benefit flowing from the provisions as substituted. The statutory provisions made in Section 6(5) change the entire complexion as to partition. However, under the law that prevailed earlier, an oral partition was recognised. In view of change of provisions of Section 6, the intendment of the legislature is clear and such a plea of oral partition is not to be readily accepted. The provisions of Section 6(5) are required to be interpreted to cast a heavy burden of proof upon proponent of oral partition before it is accepted such as separate occupation of portions, appropriation of the income, and consequent entry in the revenue records and invariably to be supported by other contemporaneous public documents admissible in evidence, may be accepted most reluctantly while exercising all safeguards. The intendment of Section 6 of the Act is only to accept the genuine partitions that might have taken place under the prevailing law and are not set up as a false defence and only oral ipse dixit is to be rejected outrightly. The object of preventing, setting up of false or frivolous defence to set at naught the benefit emanating from amended provisions, has to be given full effect. Otherwise, it would become very easy to deprive the daughter of her rights as a coparcener. When such a defence is taken, the court has to be very extremely careful in accepting the same, and only if very cogent, impeccable, and contemporaneous documentary evidence in shape of public documents in support are available, such a plea may be entertained, not otherwise. We reiterate that the plea of an oral partition or memorandum of partition, unregistered one can be manufactured at any point in time, without any contemporaneous public document needs rejection at all costs. We say so for exceptionally good cases where partition is proved conclusively, and we caution the courts that the finding is not to be based on the preponderance of probabilities in view of provisions of gender justice and the rigour of very heavy burden of proof which meets the intendment of Explanation to Section 6(5). It has to be remembered that the courts cannot defeat the object of the beneficial provisions made by the Amendment Act.

The exception is carved out by us as earlier executionof a registered document for partition was notnecessary, and the court was rarely approached for thesake of family prestige. It was approached as a lastresort when parties were not able to settle their familydispute amicably. We take note of the fact that evenbefore 1956, partition in other modes than envisagedunder Section 6(5) had taken place.

137. Resultantly, we answer the reference as under:
137.1. The provisions contained in substitutedSection 6 of the Hindu Succession Act, 1956 conferstatus of coparcener on the daughter born before orafter the amendment in the same manner as son withsame rights and liabilities.

137.2. The rights can be claimed by the daughterborn earlier with effect from 9-9-2005 with savings asprovided in Section 6(1) as to the disposition oralienation, partition or testamentary disposition whichhad taken place before the 20th day of December,2004.

137.3. Since the right in coparcenary is by birth, itis not necessary that father coparcener should be livingas on 9-9-2005.

137.4. The statutory fiction of partition created bythe proviso to Section 6 of the Hindu Succession Act,1956 as originally enacted did not bring about theactual partition or disruption of coparcenary. The fictionwas only for the purpose of ascertaining share ofdeceased coparcener when he was survived by a femaleheir, of Class I as specified in the Schedule to the 1956Act or male relative of such female. The provisions ofthe substituted Section 6 are required to be given fulleffect. Notwithstanding that a preliminary decree hasbeen passed, the daughters are to be given share incoparcenary equal to that of a son in pendingproceedings for final decree or in an appeal.

137.5. In view of the rigour of provisions of the Explanation to Section 6(5) of the 1956 Act, a plea of oral partition cannot be accepted as the statutory recognised mode of partition effected by a deed of partition duly registered under the provisions of the Registration Act, 1908 or effected by a decree of a court. However, in exceptional cases where plea of oral partition is supported by public documents and partition is finally evinced in the same manner as if it had been affected (sic effected) by a decree of a court, it may be accepted. A plea of partition based on oral evidence alone cannot be accepted and to be rejected outrightly.”

50. This would show that if there is no partition as required under Section 6(5) of the amended provisions of the Hindu Succession Act, then the daughters would also become coparceners in their individual capacity since 1956 when the Act came into force. There is no such exclusive prospectivity.

51. From the above discussion, it is clear that when there is partition of ancestral property, it would not change the nature of ancestrality of property. But the devolution of property happens as per rules setout in Section 8 of Hindu Succession Act. The property remains to be ancestral in the hands of such sharers and his descendants.

52. Resultantly, the following aspects would emerge:

a) When there is a partition among the brothers in respect of the ancestral properties, (particularly when there is notional partition on account of application of proviso to Section 6 of unamended Act) they continue to be the ancestral properties among the smaller coparcenery of each of such brothers, though there is severance among the brothers interse.

b) The property will not change the character of the ancestral property among such sharers of the partition and even if a son is born, then the sons surviving as well as born subsequently would get a share as coparceners.

c) If there is a partition as contemplated under Section 6(5) of Hindu Succession Act, prior to coming into force of Amending Act of 2005, the female heirs are entitled to a share, in the notional share that was to be allotted to their father. The concept of notional partition as laid down under the Proviso to Section 6 of the Hindu Succession Act, would come in play.

(d) In case, the partition is effected by the father, who is the karta, during his life time among all the members of the coparcenery in respect of properties acquired by the coparcenery, then each of the sharer would get the property in his individual capacity and the property loses the character of the ancestral property. This is because the coparcenery itself disrupts completely.

e) Now by Amending Act of 2005, female heirs are also given the status of coparcener, subject to certain conditions as mentioned in Section 6(5).

53. In the instant case, no-doubt the partition of the year 1972 among Govindareddy and Gurumurthy resulted in the suit item Nos. 1 and 3 being allotted to Govindareddy and Govindareddy did not effect the partition till his death in the year 1987. Therefore, the coparcenery consisting of Govindareddy and his sons continued till his death in the year 1987. When he died, the coparcenery of the sons of Govindareddy, i.e., defendant Nos.1 to 4, 12 would continue, wherein the plaintiffs and other daughters of Govindareddy along with defendant No.1 were members. Thus, it is evident that the suit schedule item Nos.1 and 3 properties are the ancestral properties in the hands of the children of Govindareddy.

54. The sum and substance of the above discussion is that if this Court comes to the conclusion that there is a partition in the year 2003, obviously which is a division, then the suit schedule property would have to devolve as per the extant law. In other words, there shall be a notional partition at the time of death of Govindareddy and a share must be given to him along with his wife and sons. In the share that has to be allotted to Govindareddy, the members of the joint family i.e., Class I heirs would get equal share. If this Court comes to the conclusion that the partition of the year 2003 is invalid, then by operation of the amended provisions of Section 6 of the Hindu Succession Act, and by virtue of the propositions laid down in the case of Vineeta Sharma, referred supra, the sons and daughters of Govindareddy would get equal share. For aforesaid reasons Point No. 1 is answered in the affirmative.

55. Having answered the point No. 1 as above, we now proceed to consider the next question as to whether the partition of the year 2003 as per Ex.P20 (Ex.D12) would hold good or not?

Re.Point No.2

56. This point need not hold this Court for long. It is pertinent to note that the relationship between the plaintiffs and defendants is not in dispute. Defendant No.4 has categorically stated in his written statement that partition dated 20-06-2003 is not subscribed by him consciously. He alleged that he being illiterate, his signature was taken by defendant Nos.1 to 3 forcibly and therefore, it is not binding on him.

57. The ocular evidence of PW1-Dhanamma, who is none else than plaintiff No.1, would show that she admits that a partition has been entered between her mother, brothers and sister Gayatri on 20-06-2003. It is not only once, but in paras 5, 14, and in the cross-examination dated 17-10-2008, she has admitted that there was a partition on 20-06-2003. It must be observed that PW1 was not a party to the said partition. Among the plaintiffs, it was only plaintiff No.4 (PW.2) who was a party to it.

58. The testimony of PW2, Gayatri, would indicate that she alleges that her signature was forcibly taken on the partition deed by taking her to Sub-Registrar's office. She states that after such registration of the Deed at Ex.P20, she went to enquire about her share, but she was beaten up by her brothers. However, she admits that she did not file any complaint to the police alleging any fraud and misrepresentation. The lengthy cross-examination of PW2 would indicate that she did not take any action in respect of the alleged fraud. Obviously, her contention about such fraud and misrepresentation is bereft of any pleadings. Therefore, the ocular evidence does not establish that the signature of PW.4 was taken forcibly on Ex.P20.

59. It is also pertinent to note that the plaintiffs pray for revocation of the Partition Deed at Ex.P20. Though the prayer is not happily worded, the trial Court has considered the same as cancellation. The trial Court granted the relief of cancellation of partition deed on the ground that when Govindareddy died, the entire suit schedule property being the individual property of Govindareddy, it would devolve upon the Class I heirs and therefore, the sons, wife and one unmarried daughter of Govindareddy could not have entered a partition by excluding the other married daughters. It did not touch upon the question whether the partition was fraudulent or otherwise. Therefore, the impugned judgment does not delve with the contention of plaintiff No.4 and defendant No.12 who alleged that it was fraudulent.

60. It must be observed that the partition deed which is at Ex.P20 states that married daughters are not entitled to the share under the Hindu Succession Act, as it stood amended under Karnataka Amendment Act, as on 20-06-2003, the partition is effected only among the sons, wife and unmarried daughter of Govindareddy. However, Ex.P20, does not mention anything about the notional partition in which Govindareddy would have entitled for a share. It totally excludes the married daughters.

61. It is necessary to note that PW.2 by transposing herself as plaintiff No.4, has spoken about the fraud and misrepresentation in executing Ex.P20, which is not borne out of the pleadings. The entire reading of the plaint would show that what the original plaintiff Nos. 1 and 2 contended was that the partition under Ex.P20 being behind their back, it does not bind them and therefore, it has to be revoked. There cannot be any doubt that when the plaintiff Nos.1 to 3 and 5 were not parties to Ex.P20, there was no necessity for them to seek for cancellation of the partition deed, but they could have sought for partition by ignoring Ex.P20. Therefore, in the absence of convincing evidence, supported by a pleading about the fraud alleged by the plaintiff No.4, the partition deed at Ex.P20 cannot be cancelled, but the plaintiffs are entitled for ignoring the same in seeking their share.

62. Defendant No.12 has also sought for cancellation of the partition deed since his signature was taken on Ex.P20 by threat. In para 36 of the impugned judgment, the trial Court considers his contention and rejects the claim that Ex.P20 is not binding on him. Obviously, rejecting the claim of defendant No.12 regarding cancellation of the partition deed and decreeing the suit holding that Ex.P20 is liable to be cancelled would be contradictory. As noted supra, instead of holding that the partition deed is not binding on the non-parties to such deed, the trial Court has granted the relief of cancellation instead of revocation as prayed.

63. Be that as it may. Ex.P20 was validly entered into by plaintiff No.4, her brothers and mother. It was registered before the Sub Registrar. There is no evidence to show that the document was fraudulently entered or is an outcome of threat and coercion. Evidently, Ex.P20 does not recognize the share of Govindareddy immediately prior to his death in the year 1987 and totally excludes the married daughters. The legislative intent of the 1956 Act was not to shunt out the daughters from the share in the joint family property. What the Act intended, as it stood prior to amendment, is that the daughters are entitled for a share in the interest of the deceased in the coparcenery property. Therefore, Ex.P20 overlooks the share entitled by the daughters even as per the pre-amended Act. Therefore, the plaintiffs are entitled for a share, in the share of Govindareddy in the coparcenery property. In that view of the matter, the Partition Deed has to be upheld as evidence of partition, but not in respect of the shares allotted to the parties. Under these circumstances, Ex.P20 will hold good only in respect of the plaintiff No.4 and defendant Nos.1 to 4 and 12 and any other parties claiming under them. Consequently point No.2 is answered in the negative.

64. The upholding of the partition in the year 2003 and holding of the suit schedule item Nos.1 and 3 properties to be the ancestral properties would result in a partition under Section 6 of the Hindu Succession Act, prior to amendment. In other words, in the notional partition, which must be considered immediately prior to the death of Govindareddy in the year 1987, he would have entitled for 1/6th share and his sons and wife would have got 1/6th share each. Since we are calculating the share after the death of defendant No.1, the share would be reduced to 1/5th share each. The said 1/5th share of Govindareddy has to be shared among all the 4 sons and 6 daughters of Govindareddy. The sons would get 1/5 + (1/5 x 1/10=1/50)= 11/50th share each. The daughters would get 1/50th share each.

65. The compensation amount received by defendant No.1 (i.e, item No. 2 of suit schedule) is utilized by her for the marriage of her daughters. The suit schedule item No. 4 house property bearing No.166 situated in Doddanekkundi Village, Bangalore was the property purchased by deceased brother of plaintiffs viz., Sri Suresh. He died intestate as a bachelor. Therefore, the said property would devolve on defendant No.1, Muniyamma as class I heir. Hence, all her children would get equal share, i.e., 1/10th in the same. Hence, the appeal succeeds in part and the following order is passed:

ORDER

The appeal is allowed in part.

It is ordered that plaintiff Nos.1 to 5 and mother of defendant Nos. 8 to 11 are entitled for 1/50th share each in suit schedule item Nos. 1 and 3 properties. They are also entitled for 1/10th share each in suit schedule item No.4 property.

Defendant Nos.2 to 4 and 12 are entitled for 11/50th share in item Nos.1 and 3 properties and 1/10th share in item No.4 property.

The judgment and decree passed by the trial Court stands modified accordingly.

The parties to the suit being siblings, costs made easy.` }
