  <!-- Tailwind CSS for responsive layout utilities -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Noto Serif Tamil (400, 500, 600) & Cormorant Garamond (italic 500, 600) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Noto+Serif+Tamil:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       1. MATTE BOTANICAL STATIONERY COLOR TOKENS
       ========================================================================== */
    :root {
      --matte-cream-outer: #F2E6D9;
      --ink-espresso: #2B1911;
      --ink-warm-cocoa: #7A4B38;
      --signature-cocoa: #3A2218;
    }

    * {
      box-sizing: border-box;
      border: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background-color: var(--matte-cream-outer);
    }

    /* ==========================================================================
       2. BORDERLESS ARTWORK BACKGROUND SETUP (image_b41c08.jpg)
       ========================================================================== */
    .stationery-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--matte-cream-outer);
      background-image: url('image_b41c08.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border: none;
      outline: none;
      box-shadow: none;
      overflow: hidden;
    }

    /* Mobile Viewports (max-width: 600px): full-bleed cover framing */
    @media (max-width: 600px) {
      .stationery-stage {
        width: 100vw;
        min-height: 100vh;
        height: 100dvh;
      }
    }

    /* Wider Desktop / Tablet Viewports (min-width: 601px): centered uncropped portrait canvas */
    @media (min-width: 601px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #F2E6D9;
      }

      .stationery-stage {
        height: 100dvh;
        max-height: 100vh;
        aspect-ratio: 710 / 1000;
        max-width: 100vw;
      }
    }

    /* ==========================================================================
       3. GENEROUS SAFE-ZONE POEM CONTAINER (AVOIDING CORNER BOTANICAL ART)
       ========================================================================== */
    .poem-safe-zone {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: clamp(5.5rem, 17vh, 9rem) clamp(2.2rem, 12vw, 4.5rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* ==========================================================================
       4. TAMIL TYPOGRAPHY & GRAPHEME STREAMING ANIMATION
       ========================================================================== */
    .tamil-poem {
      font-family: 'Noto Serif Tamil', serif;
      font-weight: 600;
      font-size: clamp(1.02rem, 3.6vw, 1.32rem);
      line-height: 2.05;
      letter-spacing: 0; /* Keeps Tamil ligatures and vowel signs intact */
      color: #2B1911;
      text-align: center;
      width: 100%;
    }

    @media (min-width: 601px) {
      .tamil-poem {
        font-size: clamp(1.06rem, 2.2vh, 1.32rem);
      }
    }

    .poem-line {
      display: block;
      margin-bottom: 1.05rem;
      min-height: 2.05em;
    }

    .poem-line:last-child {
      margin-bottom: 0;
    }

    /* Prevents any Tamil word from wrapping mid-word on narrow mobile screens */
    .word {
      display: inline-block;
      white-space: nowrap;
      letter-spacing: 0;
    }

    /* Individual Tamil grapheme cluster transition */
    .grapheme {
      display: inline-block;
      opacity: 0;
      transform: translateY(6px);
      color: var(--ink-warm-cocoa);
      will-change: opacity, transform, color;
      transition:
        opacity 0.56s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.56s cubic-bezier(0.22, 1, 0.36, 1),
        color 0.7s ease-out;
    }

    .grapheme.revealed {
      opacity: 1;
      transform: translateY(0);
      color: #2B1911;
    }

    /* ==========================================================================
       5. STATIC CLOSING REVEAL ("I love you Paalgova 😘")
       ========================================================================== */
    .finale-signature {
      margin-top: 2.1rem;
      opacity: 0;
      transform: translateY(8px);
      transition:
        opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .finale-signature.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .signature-text {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 600;
      font-size: clamp(1.3rem, 4.6vw, 1.75rem);
      line-height: 1.3;
      color: #3A2218;
      letter-spacing: 0.01em;
    }

    @media (min-width: 601px) {
      .signature-text {
        font-size: clamp(1.38rem, 2.9vh, 1.75rem);
      }
    }

    /* Isolated native Unicode kiss emoji — remains completely still once revealed */
    .native-emoji {
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      font-style: normal;
      font-weight: 400;
      display: inline-block;
      margin-left: 4px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

  <!-- Borderless Matte Botanical Stationery Canvas -->
  <main id="stationeryStage" class="stationery-stage">
    <!-- Open Center Safe Zone for Poem & Closing Signature -->
    <div class="poem-safe-zone">
      <section id="poemContainer" class="tamil-poem" aria-label="Tamil Poem"></section>

      <p id="finaleSignature" class="finale-signature">
        <span class="signature-text">I love you Paalgova </span><span class="native-emoji" role="img" aria-label="kiss">😘</span>
      </p>
    </div>
  </main>

  <script>
    /**
     * ==========================================================================
     * 1. EXACT 4-LINE TAMIL POEM
     * ==========================================================================
     */
    const POEM_LINES = [
      "உயிர் வரை தீண்டும் உன் அருகாமையின் ஏக்கம்,",
      "உறங்காமல் தவிக்கின்ற என் இரவுகளின் தாகம்;",
      "என் சுவாசக் காற்றெல்லாம் உன் வரவையே தேடும்,",
      "என் உயிரின் ஆழம் வரை உன் காதலையே நாடும்"
    ];

    const poemContainer = document.getElementById('poemContainer');
    const finaleSignature = document.getElementById('finaleSignature');

    /**
     * ==========================================================================
     * 2. GRAPHEME-SAFE TAMIL SEGMENTATION
     * Preserves all Tamil consonant-vowel ligatures and pulli marks intact.
     * ==========================================================================
     */
    function splitGraphemes(text) {
      if (typeof Intl !== 'undefined' && typeof Intl.Segmenter === 'function') {
        const segmenter = new Intl.Segmenter('ta', { granularity: 'grapheme' });
        return Array.from(segmenter.segment(text), (item) => item.segment);
      }
      return Array.from(text);
    }

    /**
     * ==========================================================================
     * 3. SEQUENTIAL LETTER-BY-LETTER STREAMING ANIMATION
     * Builds all Tamil grapheme nodes first, paints their initial hidden state,
     * and reveals each character smoothly along a requestAnimationFrame timeline.
     * ==========================================================================
     */
    function startPoemReveal() {
      if (!poemContainer || !finaleSignature) return;

      poemContainer.innerHTML = '';
      finaleSignature.classList.remove('visible');

      const timeline = [];
      let currentDelay = 320;
      const charInterval = 58;
      const linePause = 420;

      POEM_LINES.forEach((lineText) => {
        const lineEl = document.createElement('span');
        lineEl.className = 'poem-line';

        const words = lineText.split(' ');

        words.forEach((word, wordIdx) => {
          const wordEl = document.createElement('span');
          wordEl.className = 'word';

          const graphemes = splitGraphemes(word);
          graphemes.forEach((char) => {
            const charEl = document.createElement('span');
            charEl.className = 'grapheme';
            charEl.textContent = char;
            wordEl.appendChild(charEl);

            timeline.push({ el: charEl, at: currentDelay, revealed: false });
            currentDelay += charInterval;
          });

          lineEl.appendChild(wordEl);

          if (wordIdx < words.length - 1) {
            lineEl.appendChild(document.createTextNode(' '));
            currentDelay += 26;
          }
        });

        poemContainer.appendChild(lineEl);
        currentDelay += linePause;
      });

      const signatureAt = currentDelay + 600;
      let signatureRevealed = false;

      // Ensure the browser paints opacity: 0 before starting CSS transitions
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const startTime = performance.now();

          function tick(now) {
            const elapsed = now - startTime;

            for (let i = 0; i < timeline.length; i++) {
              const item = timeline[i];
              if (!item.revealed && elapsed >= item.at) {
                item.el.classList.add('revealed');
                item.revealed = true;
              }
            }

            if (!signatureRevealed && elapsed >= signatureAt) {
              finaleSignature.classList.add('visible');
              signatureRevealed = true;
            }

            if (!signatureRevealed) {
              requestAnimationFrame(tick);
            }
          }

          requestAnimationFrame(tick);
        });
      });
    }

    // Start immediately once DOM is ready instead of waiting on external resources
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startPoemReveal, { once: true });
    } else {
      startPoemReveal();
    }
  </script>
</body>
</html>
