<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Little Love Story</title>
<style>
:root{--pink:#ff6f9f;--gold:#ffd9a0}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#080711}
body{margin:0;overflow:hidden;overscroll-behavior:none;background:radial-gradient(ellipse at 50% 15%,#25203a 0,#100e1c 45%,#07070d 100%);color:#fff;font-family:Georgia,'Times New Roman',serif;overflow-x:hidden}
.intro{display:none}
.intro:before,.intro:after{content:"";position:absolute;width:40vmax;height:40vmax;border-radius:50%;filter:blur(70px);opacity:.15;pointer-events:none}
.intro:before{background:#d34f92;top:-20vmax;left:-15vmax}.intro:after{background:#7464db;right:-18vmax;bottom:-25vmax}
.kicker{letter-spacing:.28em;text-transform:uppercase;font:11px Arial,sans-serif;color:#f4c9d8}
h1{font-size:clamp(38px,8vw,76px);font-weight:400;line-height:1.05;margin:22px 0 16px;text-shadow:0 0 35px #ff6f9f55}
.intro p{font:14px/1.8 Arial,sans-serif;color:#c9c1d2;max-width:440px;margin:0 auto}
.scrollhint{position:absolute;bottom:34px;font:10px Arial,sans-serif;letter-spacing:.2em;color:#e9b7cb}
.scrollhint span{display:block;font-size:22px;margin-top:10px;animation:bob 1.5s infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.story{height:100vh;position:fixed;inset:0;z-index:1}
.sticky{position:fixed;inset:0;height:100vh;min-height:560px;display:flex;align-items:center;justify-content:center;padding:30px 16px;overflow:hidden}
.glow{position:absolute;width:min(85vw,650px);aspect-ratio:1;border-radius:50%;background:#ff7ba21c;filter:blur(65px)}
.frame{position:relative;width:min(88vw,430px);height:min(76vh,760px);border-radius:22px;overflow:hidden;border:1px solid #ffffff35;box-shadow:0 25px 90px #000b,0 0 45px #ff8db52a;background:#17131f;transform:perspective(1000px) rotateY(var(--tilt,0deg));transition:transform .2s}
canvas{width:100%;height:100%;display:block}
.frame:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:22px;box-shadow:inset 0 0 35px #120d20aa}
.love-overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:4;opacity:0;transform:scale(.45);pointer-events:none;background:radial-gradient(circle,rgba(255,55,130,.20),rgba(8,4,18,.08) 55%,transparent 75%);transition:opacity .25s,transform .55s cubic-bezier(.16,1,.3,1)}
.love-overlay.show{opacity:1;transform:scale(1)}
.love-overlay h2{font-size:clamp(38px,10vw,72px);font-weight:400;text-align:center;color:#fff0f6;text-shadow:0 0 12px #ff3e91,0 0 32px #ff2784,0 0 70px #ff2784;animation:lovePulse 1.1s ease-in-out infinite alternate}
@keyframes lovePulse{to{transform:scale(1.09);filter:brightness(1.25)}}
.heart-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.heart{position:absolute;bottom:-35px;color:#ff6f9f;animation:rise linear forwards;text-shadow:0 0 15px #ff4e9b}
@keyframes rise{to{transform:translate3d(var(--drift),-110%,0) rotate(35deg) scale(1.5);opacity:0}}
.caption{position:absolute;bottom:4.5vh;left:15px;right:15px;text-align:center;font-size:clamp(17px,3vw,24px);color:#f8dce7;text-shadow:0 2px 15px #000;transition:opacity .4s}
.progress{position:absolute;top:24px;left:50%;transform:translateX(-50%);font:10px Arial,sans-serif;letter-spacing:.22em;color:#e9c7d4;white-space:nowrap}
.final{height:100vh;min-height:620px;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;padding:25px}
.final h2{font-size:clamp(48px,12vw,100px);font-weight:400;margin:0;color:#ffd9e7;text-shadow:0 0 18px #ff5c9c,0 0 55px #ff3f8c88;animation:pulse 2s ease-in-out infinite}
.final p{display:none}
@keyframes pulse{50%{transform:scale(1.045);text-shadow:0 0 30px #ff75ad,0 0 90px #ff3f8c}}
.heart{position:absolute;bottom:-40px;color:#ff6f9f;animation:rise linear forwards;pointer-events:none;text-shadow:0 0 15px #ff4e9b}
@keyframes rise{to{transform:translate3d(var(--drift),-110vh,0) rotate(35deg) scale(1.5);opacity:0}}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe6f0;box-shadow:0 0 12px #ff8eb9;animation:twinkle 2s infinite alternate}
@keyframes twinkle{to{opacity:.15;transform:scale(.4)}}
@media(max-height:650px){.frame{height:72vh}.intro{min-height:520px}}
</style>
</head>
<body>
<section class="story" id="story">
 <div class="sticky">
  <div class="glow"></div>
  <div class="frame" id="frame">
   <canvas id="art"></canvas>
   <div class="love-overlay" id="loveOverlay"><h2>I LOVE YOU ❤️</h2></div>
   <div class="heart-layer" id="heartLayer"></div>
  </div>
 </div>
</section>

const canvas=document.getElementById('art'),ctx=canvas.getContext('2d');
const img=new Image();img.src=PHOTO;
let W=0,H=0,sketch=document.createElement('canvas'),sctx=sketch.getContext('2d'),progress=0;
function fit(){
 const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
 W=Math.max(1,Math.round(r.width*d));H=Math.max(1,Math.round(r.height*d));
 canvas.width=W;canvas.height=H;sketch.width=W;sketch.height=H;
 if(img.complete&&img.naturalWidth) render();
}
function drawCover(c){
 const scale=Math.max(W/img.naturalWidth,H/img.naturalHeight),w=img.naturalWidth*scale,h=img.naturalHeight*scale;
 c.drawImage(img,(W-w)/2,(H-h)/2,w,h);
}
function makeSketch(){
 sctx.clearRect(0,0,W,H);sctx.save();sctx.filter='grayscale(1) contrast(1.65) brightness(1.25)';drawCover(sctx);sctx.restore();
 const im=sctx.getImageData(0,0,W,H),p=im.data;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const i=(y*W+x)*4, right=(y*W+Math.min(W-1,x+2))*4, down=(Math.min(H-1,y+2)*W+x)*4;
  const lum=(p[i]+p[i+1]+p[i+2])/3, edge=Math.abs(lum-(p[right]+p[right+1]+p[right+2])/3)+Math.abs(lum-(p[down]+p[down+1]+p[down+2])/3);
  const grain=((x*17+y*31)%13)-6, v=Math.max(0,Math.min(255,246-edge*2.7+grain));
  p[i]=v;p[i+1]=v;p[i+2]=v;p[i+3]=255;
 }
 sctx.putImageData(im,0,0);
}
const cols=18,rows=26;
const tileOrder=[];
for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)tileOrder.push({x,y,key:Math.random()});
tileOrder.sort((a,b)=>a.key-b.key);
const scrambleOrder=tileOrder.map((t,i)=>({x:t.x,y:t.y,dx:(i%cols),dy:Math.floor(i/cols)}));
function render(){
 if(!img.naturalWidth)return;
 ctx.clearRect(0,0,W,H);
 const tileW=W/cols,tileH=H/rows;
 const cover=Math.max(W/img.naturalWidth,H/img.naturalHeight);
 const cropW=W/cover,cropH=H/cover;
 const ox=(img.naturalWidth-cropW)/2,oy=(img.naturalHeight-cropH)/2;

 // At the beginning, show shuffled coarse colour tiles, not the intact photograph.
 const small=document.createElement('canvas');
 const sw=cols,sh=rows;small.width=sw;small.height=sh;
 const sc=small.getContext('2d');sc.imageSmoothingEnabled=true;
 sc.drawImage(img,ox,oy,cropW,cropH,0,0,sw,sh);
 const mosaic=sc.getImageData(0,0,sw,sh);
 const scrambled=document.createElement('canvas');scrambled.width=W;scrambled.height=H;
 const bc=scrambled.getContext('2d');bc.imageSmoothingEnabled=false;
 for(let i=0;i<tileOrder.length;i++){
  const src=tileOrder[i],destX=i%cols,destY=Math.floor(i/cols);
  bc.drawImage(small,src.x,src.y,1,1,destX*tileW,destY*tileH,tileW+1,tileH+1);
 }
 ctx.drawImage(scrambled,0,0);

 // As the user scrolls, the correct sharp image tiles snap into their proper positions.
 const reveal=Math.floor(tileOrder.length*progress);
 for(let i=0;i<reveal;i++){
  const t=tileOrder[i],x=t.x*tileW,y=t.y*tileH;
  ctx.drawImage(img,ox+t.x/cols*cropW,oy+t.y/rows*cropH,cropW/cols,cropH/rows,x,y,tileW+.8,tileH+.8);
 }
 // A few last pixels sharpen into place at the very end.
 if(progress>.94){
  const a=Math.min(1,(progress-.94)/.06);
  ctx.save();ctx.globalAlpha=a;ctx.drawImage(img,ox,oy,cropW,cropH,0,0,W,H);ctx.restore();
 }
}
let burstTriggered=false;
function launchHearts(){
 const layer=document.getElementById('heartLayer');
 for(let i=0;i<54;i++){
  const h=document.createElement('span');h.className='heart';h.textContent=['♥','♡','❤'][i%3];
  h.style.left=Math.random()*100+'%';h.style.fontSize=(14+Math.random()*27)+'px';
  h.style.animationDuration=(2.4+Math.random()*3.2)+'s';
  h.style.setProperty('--drift',(Math.random()*150-75)+'px');
  layer.appendChild(h);setTimeout(()=>h.remove(),6200);
 }
}
function update(){
 render();
 document.getElementById('frame').style.setProperty('--tilt',((progress-.5)*2)+'deg');
 const overlay=document.getElementById('loveOverlay');
 if(progress>.965){
  overlay.classList.add('show');
  if(!burstTriggered){burstTriggered=true;launchHearts()}
 }else{
  overlay.classList.remove('show');
  if(progress<.90)burstTriggered=false;
 }
}
// Wheel/trackpad gestures change the reveal progress without moving the page.
window.addEventListener('wheel',e=>{
 e.preventDefault();
 progress=Math.max(0,Math.min(1,progress+e.deltaY/1900));
 update();
},{passive:false});
// Touch swipes also control the reveal while the viewport stays fixed.
let touchY=null;
window.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY;},{passive:true});
window.addEventListener('touchmove',e=>{
 if(touchY===null)return;
 e.preventDefault();
 const y=e.touches[0].clientY,delta=touchY-y;
 progress=Math.max(0,Math.min(1,progress+delta/950));
 touchY=y;update();
},{passive:false});
window.addEventListener('touchend',()=>{touchY=null;},{passive:true});
window.addEventListener('keydown',e=>{
 if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();progress=Math.min(1,progress+.035);update()}
 if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();progress=Math.max(0,progress-.035);update()}
});
img.onload=()=>{fit();progress=0;update()};window.addEventListener('resize',()=>{fit();update()});
